<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>薰衣草夜 · 小说编辑器</title>
<style>
/* ============================================================
   薰衣草夜 · 小说编辑器 — INFP 深紫夜晚主题
   ============================================================ */

:root {
  --lav-0:   #0b0714;
  --lav-1:   #110b1f;
  --lav-2:   #17102a;
  --lav-3:   #1e1636;
  --lav-4:   #271c45;
  --lav-5:   #342455;

  --purple-soft: #a58bff;
  --purple-mid:  #8b6ff0;
  --purple-deep: #6c4fd0;
  --lilac:       #c9b6ff;
  --mist:        #d9cfff;
  --lav-glow:    rgba(165,139,255,0.28);

  --text-1: #ece6ff;
  --text-2: #b3a7d4;
  --text-3: #7a6d9e;

  --line:   rgba(165,139,255,0.14);
  --line-2: rgba(165,139,255,0.24);

  --danger: #ff6b93;
  --ok:     #8ee0c0;

  --r-lg: 20px;
  --r-md: 14px;
  --r-sm: 10px;

  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  height: 100%;
  overflow: hidden;
  background: var(--lav-0);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
               "Noto Sans SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  color: var(--text-1);
  font-size: 15px;
  line-height: 1.6;
  background:
    radial-gradient(120% 70% at 78% -12%, rgba(165,139,255,0.20) 0%, transparent 58%),
    radial-gradient(90% 55% at 8% 4%,  rgba(108,79,208,0.16) 0%, transparent 62%),
    radial-gradient(140% 80% at 50% 118%, rgba(139,111,240,0.20) 0%, transparent 60%),
    linear-gradient(178deg, var(--lav-2) 0%, var(--lav-1) 42%, var(--lav-0) 100%);
  background-attachment: fixed;
  user-select: none;
  -webkit-user-select: none;
}

/* 星点层 */
body::before {
  content: "";
  position: fixed; inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(1.4px 1.4px at 18% 12%, rgba(217,207,255,0.55), transparent),
    radial-gradient(1.2px 1.2px at 72% 8%,  rgba(217,207,255,0.42), transparent),
    radial-gradient(1.6px 1.6px at 41% 26%, rgba(201,182,255,0.34), transparent),
    radial-gradient(1.1px 1.1px at 88% 31%, rgba(217,207,255,0.38), transparent),
    radial-gradient(1.3px 1.3px at 9%  44%, rgba(201,182,255,0.28), transparent),
    radial-gradient(1.1px 1.1px at 61% 55%, rgba(217,207,255,0.22), transparent);
  opacity: .8;
}

/* ================= 布局 ================= */
.app-shell { position: relative; height: 100%; }

.view {
  position: absolute; inset: 0;
  display: none;
  flex-direction: column;
  height: 100%;
}
.view.active { display: flex; animation: viewIn .32s cubic-bezier(.22,1,.36,1); }

@keyframes viewIn {
  from { opacity: 0; transform: translateY(10px) scale(.995); }
  to   { opacity: 1; transform: none; }
}

/* ================= 顶栏 ================= */
.topbar {
  position: relative; z-index: 5;
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 12px;
  padding: calc(var(--safe-t) + 14px) 16px 14px;
  background: linear-gradient(180deg, rgba(23,16,42,0.94) 0%, rgba(23,16,42,0.72) 70%, transparent 100%);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--line);
}

.topbar-left, .topbar-right { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; }
.topbar-title { flex: 1 1 auto; min-width: 0; }

.topbar-title h1 {
  margin: 0;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: .5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  background: linear-gradient(100deg, var(--mist) 0%, var(--lilac) 45%, var(--purple-soft) 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}

.topbar-title p {
  margin: 2px 0 0;
  font-size: 11.5px;
  color: var(--text-3);
  letter-spacing: .8px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.logo-mark {
  font-size: 22px;
  color: var(--lilac);
  text-shadow: 0 0 16px var(--lav-glow);
  display: inline-block;
  animation: breathe 5s ease-in-out infinite;
}
@keyframes breathe {
  0%,100% { opacity: .72; transform: scale(1); }
  50%     { opacity: 1;   transform: scale(1.07); }
}

/* ================= 按钮 ================= */
.icon-btn {
  width: 40px; height: 40px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: rgba(52,36,85,0.42);
  color: var(--lilac);
  cursor: pointer;
  transition: transform .16s, background .2s, box-shadow .2s, border-color .2s;
  flex: 0 0 auto;
}
.icon-btn:active { transform: scale(.9); background: rgba(108,79,208,0.5); }
.icon-btn.accent {
  background: linear-gradient(145deg, var(--purple-mid), var(--purple-deep));
  border-color: rgba(201,182,255,0.4);
  color: #fff;
  box-shadow: 0 6px 22px rgba(108,79,208,0.45), inset 0 1px 0 rgba(255,255,255,.18);
}
.icon-btn.accent:active { box-shadow: 0 2px 10px rgba(108,79,208,0.5); }

/* ================= 滚动区 ================= */
.scroll-area {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px 16px calc(var(--safe-b) + 40px);
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.scroll-area::-webkit-scrollbar { width: 0; height: 0; }

/* ================= 书本卡片 ================= */
.book-card {
  position: relative;
  display: flex; gap: 14px;
  padding: 16px;
  margin-bottom: 14px;
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background: linear-gradient(150deg, rgba(52,36,85,0.55) 0%, rgba(30,22,54,0.75) 100%);
  box-shadow: 0 10px 30px rgba(6,3,15,0.5), inset 0 1px 0 rgba(201,182,255,0.07);
  cursor: pointer;
  overflow: hidden;
  transition: transform .18s cubic-bezier(.22,1,.36,1), box-shadow .22s, border-color .22s;
  animation: cardIn .38s cubic-bezier(.22,1,.36,1) backwards;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: none; }
}
.book-card::after {
  content: "";
  position: absolute; left: 0; top: 14%; bottom: 14%;
  width: 3px; border-radius: 0 3px 3px 0;
  background: linear-gradient(180deg, var(--purple-soft), var(--purple-deep));
  opacity: .75;
}
.book-card:active {
  transform: scale(.976);
  border-color: var(--line-2);
  box-shadow: 0 6px 20px rgba(6,3,15,0.6), 0 0 0 1px var(--lav-glow);
}

.book-spine {
  flex: 0 0 auto;
  width: 46px; height: 60px;
  border-radius: 8px 12px 12px 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 21px; font-weight: 700;
  color: rgba(255,255,255,0.92);
  background: linear-gradient(150deg, var(--purple-mid), var(--lav-5) 70%);
  box-shadow: inset 0 0 0 1px rgba(201,182,255,0.25), 0 4px 14px rgba(0,0,0,.4);
  text-shadow: 0 1px 6px rgba(0,0,0,.35);
}

.book-info { flex: 1 1 auto; min-width: 0; }
.book-info h3 {
  margin: 0 0 5px;
  font-size: 16.5px; font-weight: 650;
  color: var(--text-1);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.book-info p {
  margin: 0;
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.58;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-word;
}
.book-info p.placeholder { color: var(--text-3); font-style: italic; }

.book-meta {
  margin-top: 9px;
  display: flex; gap: 12px; align-items: center;
  font-size: 11px; color: var(--text-3); letter-spacing: .4px;
}
.book-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-3); opacity: .6; }

/* ================= 空状态 ================= */
.empty-hint {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px; pointer-events: none;
  color: var(--text-3);
  animation: viewIn .5s ease;
}
.empty-hint[hidden] { display: none; }
.empty-icon {
  font-size: 46px; color: var(--lav-5);
  margin-bottom: 8px;
  text-shadow: 0 0 40px var(--lav-glow);
}
.empty-hint p { margin: 0; font-size: 15px; color: var(--text-2); letter-spacing: 1px; }
.empty-hint span { font-size: 12.5px; }

/* ================= 章节列表 / 文件管理器 ================= */
.breadcrumb-bar {
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 14px;
  padding: 9px 13px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: rgba(30,22,54,0.55);
  font-size: 12.5px;
  color: var(--text-2);
  overflow-x: auto;
  scrollbar-width: none;
  white-space: nowrap;
}
.breadcrumb-bar::-webkit-scrollbar { display: none; }
.crumb { cursor: pointer; padding: 2px 7px; border-radius: 7px; flex: 0 0 auto; }
.crumb:active { background: rgba(108,79,208,0.35); }
.crumb.current { color: var(--lilac); font-weight: 600; }
.crumb-sep { color: var(--text-3); opacity: .6; flex: 0 0 auto; }

.fm-row {
  position: relative;
  display: flex; align-items: center; gap: 12px;
  padding: 13px 14px;
  margin-bottom: 9px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: linear-gradient(140deg, rgba(46,32,76,0.5), rgba(27,20,48,0.7));
  cursor: pointer;
  transition: transform .16s, background .2s, border-color .2s;
  animation: cardIn .3s cubic-bezier(.22,1,.36,1) backwards;
}
.fm-row:active {
  transform: scale(.982);
  background: rgba(60,42,102,0.6);
  border-color: var(--line-2);
}
.fm-row.dragging { opacity: .45; border-style: dashed; border-color: var(--purple-soft); }
.fm-row.move-pending { box-shadow: 0 0 0 1px var(--purple-soft), 0 0 18px rgba(165,139,255,.3); }

.fm-icon {
  flex: 0 0 auto; width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 11px;
  font-size: 18px;
  background: rgba(108,79,208,0.22);
  border: 1px solid rgba(165,139,255,0.2);
  color: var(--lilac);
}
.fm-row.is-folder .fm-icon { background: rgba(165,139,255,0.16); }
.fm-row.is-chapter .fm-icon { background: rgba(139,111,240,0.14); }
/* 设定类节点：青玉色调，与章节/文件夹区分 */
.fm-row.fm-setting .fm-icon {
  background: rgba(110,214,196,0.14);
  border-color: rgba(110,214,196,0.26);
  color: #7fe3cd;
}
.fm-row.fm-setting .fm-tail { color: var(--ok); opacity: .9; }
.fm-row.fm-setting::before {
  content: "";
  position: absolute; left: 0; top: 18%; bottom: 18%;
  width: 2px; border-radius: 0 2px 2px 0;
  background: linear-gradient(180deg, #7fe3cd, rgba(127,227,205,0.15));
}
.meta-setting { color: #7fe3cd !important; }

.fm-main { flex: 1 1 auto; min-width: 0; }
.fm-main .fm-name {
  font-size: 15px; font-weight: 560; color: var(--text-1);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.fm-main .fm-sub {
  margin-top: 2px;
  font-size: 11.5px; color: var(--text-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.fm-tail {
  flex: 0 0 auto;
  font-size: 11.5px; color: var(--purple-soft);
  font-variant-numeric: tabular-nums;
  letter-spacing: .3px;
  opacity: .85;
}
.fm-chevron { flex: 0 0 auto; color: var(--text-3); opacity: .6; }

.fm-move-tag {
  position: absolute; top: -7px; left: 40px;
  font-size: 10px; letter-spacing: .5px;
  padding: 1px 7px; border-radius: 6px;
  background: linear-gradient(140deg, var(--purple-mid), var(--purple-deep));
  color: #fff;
}

/* ================= 编辑器 ================= */
.editor-area {
  display: flex; flex-direction: column;
  padding: 0;
  position: relative;
}

.editor-title-wrap { padding-right: 4px; }

.editor-kind-tag {
  display: inline-block;
  margin-top: 3px;
  font-size: 10px; letter-spacing: .8px;
  color: var(--lilac);
  padding: 1px 7px;
  border-radius: 6px;
  background: rgba(108,79,208,0.28);
  border: 1px solid rgba(165,139,255,0.22);
}
.editor-kind-tag[hidden] { display: none; }
.editor-title-input {
  width: 100%;
  border: none; outline: none;
  background: transparent;
  font-size: 17px; font-weight: 650;
  color: var(--text-1);
  font-family: inherit;
  padding: 3px 0;
  border-bottom: 1px dashed transparent;
  transition: border-color .2s;
  user-select: text; -webkit-user-select: text;
}
.editor-title-input:focus { border-bottom-color: var(--line-2); }
.editor-title-input::placeholder { color: var(--text-3); font-weight: 400; }

.word-count-chip {
  display: flex; align-items: baseline; gap: 2px;
  padding: 6px 11px;
  border-radius: 11px;
  border: 1px solid var(--line-2);
  background: rgba(52,36,85,0.5);
  color: var(--lilac);
  font-variant-numeric: tabular-nums;
  transition: transform .18s;
}
.word-count-chip b { font-size: 14px; font-weight: 700; }
.word-count-chip span { font-size: 10px; opacity: .75; }
.word-count-chip.pulse { animation: chipPulse .3s ease; }
@keyframes chipPulse { 50% { transform: scale(1.1); } }

.editor-body {
  flex: 1 1 auto;
  width: 100%;
  min-height: 0;
  resize: none;
  border: none; outline: none;
  background: transparent;
  padding: 20px 20px 30px;
  color: var(--text-1);
  font-family: Georgia, "Songti SC", "Noto Serif SC", "Source Han Serif SC", serif;
  font-size: 16.5px;
  line-height: 2.0;
  letter-spacing: .4px;
  user-select: text; -webkit-user-select: text;
  caret-color: var(--purple-soft);
}
.editor-body::placeholder { color: var(--text-3); font-style: italic; opacity: .7; }
.editor-body::-webkit-scrollbar { width: 0; }

.editor-status {
  position: absolute; left: 20px; bottom: calc(var(--safe-b) + 10px);
  font-size: 11px; color: var(--text-3);
  letter-spacing: .6px;
  opacity: 0; transition: opacity .3s;
  pointer-events: none;
}
.editor-status.show { opacity: .8; }

/* ================= 悬浮窗 ================= */
.overlay {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  background: rgba(8,4,18,0.68);
  backdrop-filter: blur(9px);
  -webkit-backdrop-filter: blur(9px);
  animation: fadeIn .2s ease;
}
.overlay[hidden] { display: none; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal {
  width: 100%; max-width: 400px;
  padding: 22px 20px 18px;
  border-radius: 22px;
  border: 1px solid var(--line-2);
  background:
    radial-gradient(120% 80% at 80% -20%, rgba(165,139,255,0.16), transparent 60%),
    linear-gradient(160deg, var(--lav-4) 0%, var(--lav-2) 100%);
  box-shadow: 0 24px 60px rgba(4,2,10,0.75), inset 0 1px 0 rgba(201,182,255,0.1);
  animation: modalIn .3s cubic-bezier(.22,1.2,.36,1);
  max-height: 86vh; overflow-y: auto;
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(18px) scale(.95); }
  to   { opacity: 1; transform: none; }
}

.modal-title {
  margin: 0 0 4px;
  font-size: 17px; font-weight: 680;
  color: var(--mist);
  letter-spacing: .5px;
}
.modal-desc {
  margin: 0;
  font-size: 13px; color: var(--text-2); line-height: 1.6;
  word-break: break-word;
}
.modal-desc:not([hidden]) + .modal-fields:not(:empty) { margin-top: 14px; }
.modal-fields { display: flex; flex-direction: column; gap: 13px; }
.modal-fields:not(:empty) { margin-top: 16px; }

.field label {
  display: block;
  font-size: 11.5px; letter-spacing: .8px;
  color: var(--text-3);
  margin-bottom: 6px;
}
.field input, .field textarea {
  width: 100%;
  padding: 11px 13px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: rgba(11,7,20,0.55);
  color: var(--text-1);
  font-family: inherit;
  font-size: 15px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
  user-select: text; -webkit-user-select: text;
}
.field textarea { resize: none; min-height: 88px; line-height: 1.65; }
.field input:focus, .field textarea:focus {
  border-color: var(--purple-soft);
  box-shadow: 0 0 0 3px rgba(165,139,255,0.14);
}
.field input::placeholder, .field textarea::placeholder { color: var(--text-3); }

.modal-actions {
  display: flex; gap: 10px;
  margin-top: 20px;
}
.btn {
  flex: 1 1 0;
  padding: 12px 14px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: rgba(52,36,85,0.45);
  color: var(--text-2);
  font-family: inherit;
  font-size: 14.5px; font-weight: 560;
  cursor: pointer;
  transition: transform .15s, background .2s, color .2s, box-shadow .2s;
}
.btn:active { transform: scale(.965); }
.btn.primary {
  background: linear-gradient(145deg, var(--purple-mid), var(--purple-deep));
  border-color: rgba(201,182,255,0.35);
  color: #fff;
  box-shadow: 0 6px 20px rgba(108,79,208,0.4);
}
.btn.danger {
  background: linear-gradient(145deg, #d94a76, #a82e58);
  border-color: rgba(255,168,192,0.3);
  color: #fff;
  box-shadow: 0 6px 20px rgba(217,74,118,0.32);
}
.btn.ghost { background: transparent; }

/* 选择型悬浮窗（文件夹 / 章节） */
.choice-list { display: flex; flex-direction: column; gap: 11px; margin-top: 16px; }
.choice-item {
  display: flex; align-items: center; gap: 14px;
  padding: 15px 16px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: linear-gradient(140deg, rgba(52,36,85,0.5), rgba(27,20,48,0.7));
  cursor: pointer;
  transition: transform .16s, background .2s, border-color .2s;
  text-align: left;
}
.choice-item:active {
  transform: scale(.975);
  border-color: var(--line-2);
  background: rgba(70,50,118,0.6);
}
.choice-item .ci-icon {
  flex: 0 0 auto; width: 42px; height: 42px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 12px; font-size: 20px;
  background: rgba(108,79,208,0.22);
  border: 1px solid rgba(165,139,255,0.2);
  color: var(--lilac);
}
.choice-item .ci-text { flex: 1 1 auto; min-width: 0; }
.choice-item .ci-text b { display: block; font-size: 15px; font-weight: 620; color: var(--text-1); }
.choice-item .ci-text span { display: block; font-size: 12px; color: var(--text-3); margin-top: 3px; }

/* ================= 长按菜单 ================= */
.sheet-overlay { align-items: flex-end; padding: 0; }
.action-sheet {
  width: 100%; max-width: 460px;
  margin: 0 auto;
  padding: 8px 12px calc(var(--safe-b) + 14px);
  border-radius: 24px 24px 0 0;
  border: 1px solid var(--line-2); border-bottom: none;
  background:
    radial-gradient(120% 70% at 50% -30%, rgba(165,139,255,0.14), transparent 65%),
    linear-gradient(180deg, var(--lav-4) 0%, var(--lav-1) 100%);
  box-shadow: 0 -16px 50px rgba(4,2,10,0.7);
  animation: sheetIn .3s cubic-bezier(.22,1,.36,1);
}
@keyframes sheetIn { from { transform: translateY(100%); } to { transform: none; } }

.sheet-head {
  padding: 14px 12px 12px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 8px;
}
.sheet-head b {
  display: block; font-size: 14.5px; color: var(--mist); font-weight: 620;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sheet-head span { display: block; font-size: 11.5px; color: var(--text-3); margin-top: 3px; letter-spacing: .6px; }

.sheet-items { display: flex; flex-direction: column; gap: 6px; padding-bottom: 4px; }
.sheet-item {
  display: flex; align-items: center; gap: 13px;
  padding: 13px 14px;
  border-radius: var(--r-md);
  border: none;
  background: transparent;
  color: var(--text-1);
  font-family: inherit; font-size: 15px;
  text-align: left; cursor: pointer;
  transition: background .18s, transform .14s;
}
.sheet-item:active { background: rgba(108,79,208,0.32); transform: scale(.985); }
.sheet-item .si-icon {
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 9px; font-size: 15px;
  background: rgba(108,79,208,0.2);
  color: var(--lilac); flex: 0 0 auto;
}
.sheet-item.danger { color: var(--danger); }
.sheet-item.danger .si-icon { background: rgba(255,107,147,0.14); color: var(--danger); }
.sheet-item.paste { color: var(--ok); }
.sheet-item.paste .si-icon { background: rgba(142,224,192,0.14); color: var(--ok); }
.sheet-item .si-sub { margin-left: auto; font-size: 11px; color: var(--text-3); }

.sheet-cancel {
  margin-top: 8px;
  width: 100%;
  padding: 13px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: rgba(52,36,85,0.35);
  color: var(--text-2);
  font-family: inherit; font-size: 14.5px;
  cursor: pointer;
}
.sheet-cancel:active { background: rgba(108,79,208,0.28); }

/* ================= Toast ================= */
.toast {
  position: fixed; z-index: 200;
  left: 50%; bottom: calc(var(--safe-b) + 34px);
  transform: translateX(-50%) translateY(14px);
  padding: 11px 20px;
  border-radius: 40px;
  border: 1px solid var(--line-2);
  background: linear-gradient(145deg, var(--lav-4), var(--lav-2));
  color: var(--mist);
  font-size: 13.5px;
  letter-spacing: .4px;
  box-shadow: 0 12px 34px rgba(4,2,10,0.65);
  opacity: 0;
  transition: opacity .25s, transform .25s;
  pointer-events: none;
  max-width: 82vw;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.toast[hidden] { display: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ================= 滚动条（桌面预览） ================= */
@media (min-width: 640px) {
  .scroll-area { padding-left: 0; padding-right: 0; }
  .scroll-area > * { max-width: 620px; margin-left: auto; margin-right: auto; }
  .scroll-area > .fm-move-tag { max-width: none; }
  .empty-hint { max-width: 620px; margin: 0 auto; }
}

/* ================= 时间线编辑器 ================= */
.tl-head {
  flex: 0 0 auto;
  display: flex; align-items: center;
  gap: 10px;
  padding: 8px 16px 8px;
  font-size: 11px; letter-spacing: 1.2px;
  color: var(--text-3);
  border-bottom: 1px solid var(--line);
  background: rgba(23,16,42,0.5);
}
/* 时间列窄，事件列宽 */
.tl-col-time { flex: 0 0 84px; width: 84px; }
.tl-col-text { flex: 1 1 auto; }

.tl-area { padding-top: 12px; }

/* 每行：左时间 + 右事件 */
.tl-row {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 0;
  margin-bottom: 6px;
  position: relative;
  border-bottom: 1px dashed rgba(165,139,255,0.10);
  animation: cardIn .3s cubic-bezier(.22,1,.36,1) backwards;
}
.tl-row:last-child { border-bottom: none; }

/* 时间输入：小占比，单行，右对齐 */
.tl-time {
  flex: 0 0 84px; width: 84px;
  padding: 9px 9px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: rgba(11,7,20,0.5);
  color: var(--lilac);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  font-variant-numeric: tabular-nums;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
  user-select: text; -webkit-user-select: text;
}
.tl-time:focus {
  border-color: var(--purple-soft);
  box-shadow: 0 0 0 3px rgba(165,139,255,0.13);
}
.tl-time::placeholder { color: var(--text-3); font-weight: 400; font-size: 11.5px; }

/* 事件输入：大占比，多行自适应 */
.tl-text {
  flex: 1 1 auto; min-width: 0;
  padding: 9px 12px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: rgba(11,7,20,0.4);
  color: var(--text-1);
  font-family: inherit;
  font-size: 14.5px;
  line-height: 1.62;
  resize: none;
  overflow: hidden;
  min-height: 42px;
  outline: none;
  transition: border-color .2s, box-shadow .2s, background .2s;
  user-select: text; -webkit-user-select: text;
}
.tl-text:focus {
  border-color: var(--purple-soft);
  background: rgba(11,7,20,0.62);
  box-shadow: 0 0 0 3px rgba(165,139,255,0.13);
}
.tl-text::placeholder { color: var(--text-3); }

/* 事件行的时间轴节点装饰 */
.tl-row::before {
  content: "";
  position: absolute;
  left: -10px; top: 20px;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--purple-soft);
  box-shadow: 0 0 8px var(--lav-glow);
  opacity: .55;
}

.tl-empty {
  text-align: center; padding: 56px 20px;
  color: var(--text-3); font-size: 13px;
}
.tl-empty .ti { font-size: 38px; opacity: .5; display: block; margin-bottom: 10px; }

.tl-hint {
  text-align: center;
  font-size: 11.5px;
  color: var(--text-3);
  padding: 18px 0 6px;
  letter-spacing: .5px;
}

/* 时间线行的长按/删除按钮 */
.tl-del {
  flex: 0 0 auto;
  align-self: center;
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-3);
  font-size: 15px;
  cursor: pointer;
  transition: background .18s, color .18s;
}
.tl-del:active { background: rgba(255,107,147,0.16); color: var(--danger); }

/* 大类图标配色：时间线 / 大纲 */
.fm-row.fm-timeline .fm-icon,
.fm-row.fm-outline .fm-icon {
  background: rgba(165,139,255,0.16);
  border-color: rgba(165,139,255,0.24);
  color: var(--lilac);
}
.fm-row.fm-timeline .fm-tail,
.fm-row.fm-outline .fm-tail { color: var(--purple-soft); }

/* ================= 设定编辑器（分类列表） ================= */
.set-area { padding-top: 14px; }

/* 单个分类卡片：头部为分类名，下方为内容区 */
.cat-card {
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background: linear-gradient(150deg, rgba(46,32,76,0.5), rgba(25,18,45,0.72));
  box-shadow: 0 8px 24px rgba(6,3,15,0.42), inset 0 1px 0 rgba(201,182,255,0.06);
  margin-bottom: 14px;
  overflow: hidden;
  animation: cardIn .32s cubic-bezier(.22,1,.36,1) backwards;
}

/* 头部：分类名 */
.cat-head {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 12px 11px 14px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(100deg, rgba(108,79,208,0.30), rgba(108,79,208,0.08));
  position: relative;
}
.cat-head::before {
  content: "";
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px;
  background: linear-gradient(180deg, var(--purple-soft), var(--purple-deep));
}
.cat-name {
  flex: 1 1 auto; min-width: 0;
  border: none; outline: none;
  background: transparent;
  color: var(--mist);
  font-family: inherit;
  font-size: 15px; font-weight: 650;
  letter-spacing: .4px;
  padding: 2px 0;
  border-bottom: 1px dashed transparent;
  transition: border-color .2s;
  user-select: text; -webkit-user-select: text;
}
.cat-name:focus { border-bottom-color: rgba(201,182,255,0.4); }
.cat-name::placeholder { color: var(--text-3); font-weight: 400; }

.cat-word {
  flex: 0 0 auto;
  font-size: 11px;
  color: var(--purple-soft);
  font-variant-numeric: tabular-nums;
  opacity: .8;
  white-space: nowrap;
}

.cat-del {
  flex: 0 0 auto;
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-3);
  font-size: 14px;
  cursor: pointer;
  transition: background .18s, color .18s;
}
.cat-del:active { background: rgba(255,107,147,0.16); color: var(--danger); }

/* 内容区：正文文本，大占比 */
.cat-body {
  display: block;
  width: 100%;
  border: none; outline: none;
  background: transparent;
  color: var(--text-1);
  font-family: inherit;
  font-size: 14.5px;
  line-height: 1.72;
  padding: 12px 14px 14px;
  resize: none;
  overflow: hidden;
  min-height: 76px;
  user-select: text; -webkit-user-select: text;
  caret-color: var(--purple-soft);
}
.cat-body::placeholder { color: var(--text-3); }

.set-empty {
  text-align: center; padding: 56px 20px;
  color: var(--text-3); font-size: 13px;
}
.set-empty .si { font-size: 38px; opacity: .5; display: block; margin-bottom: 10px; }

.set-hint {
  text-align: center;
  font-size: 11.5px; color: var(--text-3);
  padding: 4px 0 8px;
  letter-spacing: .4px;
}

/* 顶栏右侧两个元素并排 */
#view-setting .topbar-right { gap: 8px; }

/* ================= 全局搜索 ================= */
.search-topbar { gap: 8px; }

.search-input {
  width: 100%;
  border: none; outline: none;
  background: transparent;
  color: var(--text-1);
  font-family: inherit;
  font-size: 16px;
  padding: 4px 0;
  user-select: text; -webkit-user-select: text;
  caret-color: var(--purple-soft);
}
.search-input::placeholder { color: var(--text-3); }
.search-input::-webkit-search-cancel-button { display: none; }

/* 模式切换 */
.search-modes {
  flex: 0 0 auto;
  display: flex; gap: 8px;
  padding: 12px 16px 10px;
  border-bottom: 1px solid var(--line);
  background: rgba(23,16,42,0.42);
}
.mode-btn {
  flex: 1 1 0;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  padding: 9px 10px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: rgba(52,36,85,0.32);
  color: var(--text-2);
  font-family: inherit;
  font-size: 13.5px;
  cursor: pointer;
  transition: background .2s, border-color .2s, color .2s, transform .14s;
}
.mode-btn:active { transform: scale(.97); }
.mode-btn.active {
  background: linear-gradient(145deg, var(--purple-mid), var(--purple-deep));
  border-color: rgba(201,182,255,0.42);
  color: #fff;
  box-shadow: 0 4px 16px rgba(108,79,208,0.38);
}
.mode-btn .mb-icon { font-size: 13px; opacity: .9; }

.search-status {
  flex: 0 0 auto;
  padding: 8px 16px 4px;
  font-size: 11.5px;
  color: var(--text-3);
  letter-spacing: .5px;
  min-height: 0;
}
.search-status:empty { display: none; }

.search-area { padding-top: 6px; }

/* 结果项 */
.sr-row {
  position: relative;
  display: flex; align-items: flex-start; gap: 11px;
  padding: 12px 14px;
  margin-bottom: 8px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: linear-gradient(140deg, rgba(46,32,76,0.5), rgba(27,20,48,0.7));
  cursor: pointer;
  transition: transform .16s, background .2s, border-color .2s;
  animation: cardIn .28s cubic-bezier(.22,1,.36,1) backwards;
}
.sr-row:active {
  transform: scale(.982);
  background: rgba(60,42,102,0.6);
  border-color: var(--line-2);
}

.sr-icon {
  flex: 0 0 auto; width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 10px;
  font-size: 16px;
  background: rgba(108,79,208,0.2);
  border: 1px solid rgba(165,139,255,0.2);
  color: var(--lilac);
}

.sr-main { flex: 1 1 auto; min-width: 0; }
.sr-name {
  font-size: 14.5px; font-weight: 560; color: var(--text-1);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sr-path {
  margin-top: 2px;
  font-size: 11px; color: var(--text-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sr-snippet {
  margin-top: 7px;
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--text-2);
  padding: 7px 10px;
  border-radius: 8px;
  background: rgba(11,7,20,0.42);
  border-left: 2px solid rgba(165,139,255,0.32);
  word-break: break-word;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.sr-snippet .hit {
  color: #ffe9a8;
  background: rgba(255,214,102,0.18);
  border-radius: 3px;
  padding: 0 2px;
  font-weight: 600;
}
.sr-name .hit {
  color: #ffe9a8;
  background: rgba(255,214,102,0.18);
  border-radius: 3px;
  padding: 0 2px;
}

.sr-tail {
  flex: 0 0 auto;
  font-size: 11px;
  color: var(--purple-soft);
  opacity: .82;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.sr-badge {
  display: inline-block;
  margin-top: 6px;
  font-size: 10px; letter-spacing: .5px;
  padding: 1px 6px; border-radius: 5px;
  background: rgba(142,224,192,0.16);
  color: #7fe3cd;
}
.sr-badge.name-only {
  background: rgba(165,139,255,0.16);
  color: var(--lilac);
}

.search-empty {
  text-align: center; padding: 56px 24px;
  color: var(--text-3); font-size: 13px; line-height: 1.8;
}
.search-empty .se-icon { font-size: 40px; opacity: .45; display: block; margin-bottom: 12px; }
.search-empty kbd {
  display: inline-block;
  padding: 1px 6px; border-radius: 5px;
  border: 1px solid var(--line-2);
  background: rgba(52,36,85,0.5);
  color: var(--text-2);
  font-size: 11px;
  font-family: inherit;
}

/* ================= IndexedDB 容量条 ================= */
.storage-bar {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 10px;
  padding: 9px 16px 10px;
  background: rgba(20,14,37,0.55);
  border-bottom: 1px solid var(--line);
}

/* 进度条轨道 */
.sb-track {
  flex: 1 1 auto;
  position: relative;
  height: 7px;
  border-radius: 4px;
  background: rgba(11,7,20,0.72);
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.45), 0 0 0 1px rgba(165,139,255,0.10);
  overflow: hidden;
}

.sb-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 0%;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--purple-mid), var(--lilac));
  box-shadow: 0 0 10px rgba(165,139,255,0.45);
  transition: width .5s cubic-bezier(.22,1,.36,1), background .3s;
}
/* 用量分级配色 */
.sb-fill.warn {
  background: linear-gradient(90deg, #e0a94a, #f5cd76);
  box-shadow: 0 0 10px rgba(224,169,74,0.42);
}
.sb-fill.danger {
  background: linear-gradient(90deg, #d94a76, #ff7ea3);
  box-shadow: 0 0 12px rgba(217,74,118,0.5);
}

/* 数值 */
.sb-text {
  flex: 0 0 auto;
  font-size: 11px;
  color: var(--text-2);
  font-variant-numeric: tabular-nums;
  letter-spacing: .3px;
  white-space: nowrap;
  min-width: 96px;
  text-align: right;
}
.sb-text b { color: var(--lilac); font-weight: 650; }
.sb-text.warn b { color: #f5cd76; }
.sb-text.danger b { color: #ff9ab7; }

/* 容量切换按钮（条的最右边） */
.sb-cap-btn {
  flex: 0 0 auto;
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 7px;
  border: 1px solid var(--line-2);
  background: rgba(52,36,85,0.5);
  color: var(--lilac);
  cursor: pointer;
  transition: transform .16s, background .2s;
}
.sb-cap-btn:active {
  transform: scale(.88);
  background: rgba(108,79,208,0.5);
}

/* 容量选项列表 */
.cap-list {
  display: flex; flex-direction: column; gap: 7px;
  margin-top: 16px;
}
.cap-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: linear-gradient(140deg, rgba(52,36,85,0.42), rgba(27,20,48,0.62));
  color: var(--text-1);
  font-family: inherit;
  font-size: 15px;
  text-align: left;
  cursor: pointer;
  transition: transform .15s, background .2s, border-color .2s;
}
.cap-item:active { transform: scale(.978); background: rgba(70,50,118,0.6); }
.cap-item .cap-val { flex: 1 1 auto; font-weight: 600; letter-spacing: .4px; }
.cap-item .cap-note { font-size: 11px; color: var(--text-3); }
.cap-item.current {
  border-color: rgba(201,182,255,0.5);
  background: linear-gradient(140deg, rgba(108,79,208,0.45), rgba(60,42,102,0.5));
  box-shadow: 0 0 0 1px rgba(165,139,255,0.22), 0 6px 18px rgba(108,79,208,0.25);
}
.cap-item .cap-check {
  flex: 0 0 auto;
  color: var(--lilac);
  font-size: 15px;
}
.cap-item .cap-check[hidden] { display: none; }

/* ================= PWA 环境徽标 ================= */
.pwa-badge {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 6px;
  border-radius: 5px;
  font-size: 9.5px;
  letter-spacing: .4px;
  color: var(--lilac);
  background: rgba(108,79,208,0.26);
  border: 1px solid rgba(165,139,255,0.22);
  vertical-align: middle;
}
.pwa-badge[hidden] { display: none; }
.pwa-badge.fennec {
  color: #7fe3cd;
  background: rgba(110,214,196,0.16);
  border-color: rgba(110,214,196,0.28);
}
</style>
</head>

<script>
/* ============================================================
   db.js — IndexedDB 数据层
   存储结构：
     books      { id, title, intro, createdAt, updatedAt }
     nodes      { id, bookId, parentId, type:'folder'|'chapter',
                  title, content, wordCount, createdAt, updatedAt }
   ============================================================ */

const DB_NAME = 'lavender-novel';
const DB_VERSION = 2;

let _db = null;

function openDB() {
  if (_db) return Promise.resolve(_db);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('books')) {
        const bs = db.createObjectStore('books', { keyPath: 'id' });
        bs.createIndex('updatedAt', 'updatedAt');
      }
      if (!db.objectStoreNames.contains('nodes')) {
        const ns = db.createObjectStore('nodes', { keyPath: 'id' });
        ns.createIndex('bookId', 'bookId');
        ns.createIndex('parentId', 'parentId');
        ns.createIndex('book_parent', ['bookId', 'parentId']);
      }
      // v2：应用设置（容量上限等）
      if (!db.objectStoreNames.contains('settings')) {
        db.createObjectStore('settings', { keyPath: 'key' });
      }
    };
    req.onsuccess = () => { _db = req.result; resolve(_db); };
    req.onerror = () => reject(req.error);
  });
}

function tx(store, mode, fn) {
  return openDB().then((db) => new Promise((resolve, reject) => {
    const t = db.transaction(store, mode);
    const s = t.objectStore(store);
    let out;
    try { out = fn(s); } catch (err) { reject(err); return; }
    t.oncomplete = () => resolve(out && out.result !== undefined ? out.result : out);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error);
  }));
}

/** 生成唯一 id */
function uid(prefix) {
  return (prefix || 'id') + '-' + Date.now().toString(36) + '-' +
         Math.random().toString(36).slice(2, 8);
}

/* ---------------- 书本 ---------------- */

const Books = {
  all() {
    return tx('books', 'readonly', (s) => s.getAll()).then((list) =>
      (list || []).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))
    );
  },
  get(id) {
    return tx('books', 'readonly', (s) => s.get(id));
  },
  add(title, intro) {
    const now = Date.now();
    const book = {
      id: uid('book'),
      title: title || '未命名书本',
      intro: intro || '',
      createdAt: now,
      updatedAt: now
    };
    return tx('books', 'readwrite', (s) => s.add(book)).then(() => book);
  },
  update(id, patch) {
    return tx('books', 'readwrite', (s) => s.get(id)).then((book) => {
      if (!book) throw new Error('书本不存在');
      Object.assign(book, patch, { updatedAt: Date.now() });
      return tx('books', 'readwrite', (s) => s.put(book)).then(() => book);
    });
  },
  touch(id) {
    return tx('books', 'readwrite', (s) => s.get(id)).then((book) => {
      if (!book) return null;
      book.updatedAt = Date.now();
      return tx('books', 'readwrite', (s) => s.put(book)).then(() => book);
    });
  },
  async remove(id) {
    // 级联删除该书所有节点
    const nodes = await Nodes.byBook(id);
    await tx('nodes', 'readwrite', (s) => {
      nodes.forEach((n) => s.delete(n.id));
      return null;
    });
    return tx('books', 'readwrite', (s) => s.delete(id));
  }
};

/* ---------------- 章节 / 文件夹节点 ---------------- */

const Nodes = {
  byBook(bookId) {
    return tx('nodes', 'readonly', (s) => s.index('bookId').getAll(bookId))
      .then((l) => l || []);
  },
  children(bookId, parentId) {
    return this.byBook(bookId).then((list) => (list || [])
      .filter((n) => (n.parentId || null) === (parentId || null))
      .sort((a, b) => {
        // 文件夹在前，其后按创建时间
        if (a.type !== b.type) return a.type === 'folder' ? -1 : 1;
        return (a.createdAt || 0) - (b.createdAt || 0);
      }));
  },
  /** 仅纯文本类节点（章节 + 设定 + 大纲），排除文件夹与时间线 */
  isText(type) { return type === 'chapter' || type === 'setting' || type === 'outline'; },
  /** 是否计入小说总字数：只有章节算，设定/大纲/时间线不算 */
  countsTowardTotal(type) { return type === 'chapter'; },
  get(id) {
    return tx('nodes', 'readonly', (s) => s.get(id));
  },
  addFolder(bookId, parentId, title) {
    const now = Date.now();
    const node = {
      id: uid('folder'), bookId, parentId,
      type: 'folder', title: title || '新建文件夹',
      content: '', wordCount: 0,
      createdAt: now, updatedAt: now
    };
    return tx('nodes', 'readwrite', (s) => s.add(node)).then(() => node);
  },
  addChapter(bookId, parentId, title) {
    const now = Date.now();
    const node = {
      id: uid('chapter'), bookId, parentId,
      type: 'chapter', title: title || '新章节',
      content: '', wordCount: 0,
      createdAt: now, updatedAt: now
    };
    return tx('nodes', 'readwrite', (s) => s.add(node)).then(() => node);
  },
  /**
   * 设定节点（分类列表结构）
   * categories: [{ id, name, content }]
   * @param kind 'character' | 'place' | 'world'
   */
  addSetting(bookId, parentId, title, kind) {
    const now = Date.now();
    const node = {
      id: uid('setting'), bookId, parentId,
      type: 'setting', kind: kind || 'character',
      title: title || '新设定',
      categories: [], wordCount: 0,
      createdAt: now, updatedAt: now
    };
    return tx('nodes', 'readwrite', (s) => s.add(node)).then(() => node);
  },
  /** 故事大纲：纯文本 */
  addOutline(bookId, parentId, title) {
    const now = Date.now();
    const node = {
      id: uid('outline'), bookId, parentId,
      type: 'outline', title: title || '故事大纲',
      content: '', wordCount: 0,
      createdAt: now, updatedAt: now
    };
    return tx('nodes', 'readwrite', (s) => s.add(node)).then(() => node);
  },
  /** 时间线：事件列表 [{ id, time, text }] */
  addTimeline(bookId, parentId, title) {
    const now = Date.now();
    const node = {
      id: uid('timeline'), bookId, parentId,
      type: 'timeline', title: title || '时间线',
      events: [], wordCount: 0,
      createdAt: now, updatedAt: now
    };
    return tx('nodes', 'readwrite', (s) => s.add(node)).then(() => node);
  },
  update(id, patch) {
    return tx('nodes', 'readwrite', (s) => s.get(id)).then((node) => {
      if (!node) throw new Error('节点不存在');
      Object.assign(node, patch, { updatedAt: Date.now() });
      return tx('nodes', 'readwrite', (s) => s.put(node)).then(() => node);
    });
  },
  /** 移动：改 parentId（原记录删除后重建，保持数据一致） */
  move(id, newParentId) {
    return tx('nodes', 'readwrite', (s) => s.get(id)).then((node) => {
      if (!node) throw new Error('节点不存在');
      node.parentId = newParentId;
      node.updatedAt = Date.now();
      return tx('nodes', 'readwrite', (s) => s.put(node)).then(() => node);
    });
  },
  /** 直接写入一条已构造好的节点（导入用） */
  putRaw(node) {
    return tx('nodes', 'readwrite', (s) => s.put(node)).then(() => node);
  },
  /** 修复悬空 parentId：父节点不存在的一律挂到根目录 */
  async repairOrphans(bookId) {
    const all = await this.byBook(bookId);
    const ids = new Set(all.map((n) => n.id));
    const broken = all.filter((n) => n.parentId && !ids.has(n.parentId));
    if (!broken.length) return 0;
    await tx('nodes', 'readwrite', (s) => {
      broken.forEach((n) => { n.parentId = null; s.put(n); });
      return null;
    });
    return broken.length;
  },
  /** 递归删除节点及其所有子孙 */
  remove(id) {
    return this.get(id).then((node) => {
      if (!node) return null;
      return Nodes.byBook(node.bookId).then((all) => {
        // 收集子树（含自身）
        const ids = new Set([id]);
        let grew = true;
        while (grew) {
          grew = false;
          all.forEach((n) => {
            if (!ids.has(n.id) && ids.has(n.parentId)) {
              ids.add(n.id); grew = true;
            }
          });
        }
        return tx('nodes', 'readwrite', (s) => {
          ids.forEach((i) => s.delete(i));
          return ids.size;
        });
      });
    });
  },
  /** 该节点是否为 targetId 的祖先（防止把文件夹移入自己的子目录） */
  isAncestorOf(candidateId, targetId, allNodes) {
    let cur = allNodes.find((n) => n.id === targetId);
    const guard = new Set();
    while (cur && cur.parentId) {
      if (cur.parentId === candidateId) return true;
      if (guard.has(cur.parentId)) return false;
      guard.add(cur.parentId);
      cur = allNodes.find((n) => n.id === cur.parentId);
    }
    return false;
  },
  /** 统计文件夹下的字数与条目数（设定单独计数，不计入小说总字数） */
  folderWordCount(folderId, allNodes) {
    const ids = new Set([folderId]);
    let grew = true;
    while (grew) {
      grew = false;
      allNodes.forEach((n) => {
        if (!ids.has(n.id) && n.parentId && ids.has(n.parentId)) { ids.add(n.id); grew = true; }
      });
    }
    let sum = 0, count = 0, settings = 0, settingWords = 0, others = 0;
    allNodes.forEach((n) => {
      if (n.id === folderId || !ids.has(n.id)) return;
      if (n.type === 'chapter') { sum += n.wordCount || 0; count++; }
      else if (n.type === 'setting') { settingWords += n.wordCount || 0; settings++; }
      else if (n.type === 'outline' || n.type === 'timeline') others++;
    });
    return { words: sum, chapters: count, settings, settingWords, others };
  }
};

/* ---------------- 应用设置 ---------------- */

const Settings = {
  get(key, fallback) {
    return tx('settings', 'readonly', (s) => s.get(key)).then((row) =>
      (row && row.value !== undefined) ? row.value : fallback
    );
  },
  set(key, value) {
    return tx('settings', 'readwrite', (s) => s.put({ key, value }));
  }
};

/* ---------------- 字数统计 ---------------- */

/** 中文按字计，英文/数字按词计，空白不计 */
function countWords(text) {
  if (!text) return 0;
  const t = String(text);
  const cjk = t.match(/[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\u3040-\u30ff]/g);
  const cjkCount = cjk ? cjk.length : 0;
  const rest = t
    .replace(/[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\u3040-\u30ff]/g, ' ')
    .replace(/[\p{P}\p{S}]/gu, ' ');
  const words = rest.split(/\s+/).filter((w) => /[A-Za-z0-9]/.test(w));
  return cjkCount + words.length;
}

<script>
/* ============================================================
   app.js — 薰衣草夜 · 小说编辑器
   ============================================================ */

const $ = (id) => document.getElementById(id);

const state = {
  bookId: null,          // 当前书本
  folderId: null,        // 当前所在文件夹（null = 根目录）
  chapterId: null,       // 当前编辑章节
  clipboard: null,       // 移动剪贴板 { id, type } —— 移动=复制+粘贴后删除
  nodesCache: []         // 当前书本全部节点缓存
};

/* ---------------- 工具 ---------------- */

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

let toastTimer = null;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.hidden = false;
  requestAnimationFrame(() => el.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => { el.hidden = true; }, 260);
  }, 1900);
}

function vibrate(ms) {
  if (navigator.vibrate) { try { navigator.vibrate(ms || 12); } catch (e) {} }
}

/* ---------------- 悬浮窗系统 ---------------- */

const Modal = {
  _onKey: null,

  /**
   * open({ title, desc, fields, actions })
   *  fields:  [{ key, label, type:'text'|'textarea', value, placeholder }]
   *  actions: [{ label, kind:'primary'|'danger'|'ghost', onClick(values, close) }]
   *  返回 close 回调
   */
  open(opts) {
    const ov = $('modal-overlay');
    const fieldsWrap = $('modal-fields');
    const actionsWrap = $('modal-actions');

    $('modal-title').textContent = opts.title || '';
    const descEl = $('modal-desc');
    if (opts.desc) { descEl.textContent = opts.desc; descEl.hidden = false; }
    else { descEl.textContent = ''; descEl.hidden = true; }

    fieldsWrap.innerHTML = '';
    const inputs = {};

    if (opts.choices && opts.choices.length) {
      const list = document.createElement('div');
      list.className = 'choice-list';
      opts.choices.forEach((c) => {
        const item = document.createElement('button');
        item.className = 'choice-item';
        item.type = 'button';
        item.innerHTML = `<span class="ci-icon">${c.icon || '✿'}</span>
          <span class="ci-text"><b>${esc(c.label)}</b>${c.hint ? `<span>${esc(c.hint)}</span>` : ''}</span>`;
        item.addEventListener('click', () => {
          vibrate();
          Modal.close();
          c.onClick();
        });
        list.appendChild(item);
      });
      fieldsWrap.appendChild(list);
    }

    (opts.fields || []).forEach((f) => {
      const wrap = document.createElement('div');
      wrap.className = 'field';

      // 自定义渲染：不生成 label/input，完全交给调用方
      if (f.type === 'custom' && typeof f.render === 'function') {
        wrap.classList.add('field-custom');
        fieldsWrap.appendChild(wrap);
        f.render(wrap);
        return;
      }

      const lab = document.createElement('label');
      lab.textContent = f.label || '';
      const inp = document.createElement(f.type === 'textarea' ? 'textarea' : 'input');
      if (f.type !== 'textarea') inp.type = 'text';
      inp.value = f.value != null ? f.value : '';
      inp.placeholder = f.placeholder || '';
      if (f.maxLength) inp.maxLength = f.maxLength;
      inp.autocomplete = 'off';
      inp.autocapitalize = 'off';
      inp.spellcheck = false;
      lab.setAttribute('for', '');
      wrap.appendChild(lab);
      wrap.appendChild(inp);
      fieldsWrap.appendChild(wrap);
      inputs[f.key] = inp;

      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && f.type !== 'textarea') {
          e.preventDefault();
          const primary = actionsWrap.querySelector('.btn.primary');
          if (primary) primary.click();
        }
      });
    });

    actionsWrap.innerHTML = '';
    (opts.actions || []).forEach((a) => {
      const btn = document.createElement('button');
      btn.className = 'btn ' + (a.kind || '');
      btn.type = 'button';
      btn.textContent = a.label;
      btn.addEventListener('click', () => {
        vibrate();
        const values = {};
        Object.keys(inputs).forEach((k) => { values[k] = inputs[k].value.trim(); });
        const r = a.onClick ? a.onClick(values, Modal.close) : undefined;
        if (r !== false && a.autoClose !== false) Modal.close();
      });
      actionsWrap.appendChild(btn);
    });

    ov.hidden = false;
    const first = Object.values(inputs)[0];
    if (first) setTimeout(() => { first.focus(); if (first.select) first.select(); }, 60);

    this._onKey = (e) => { if (e.key === 'Escape') Modal.close(); };
    document.addEventListener('keydown', this._onKey);
    return Modal.close;
  },

  close() {
    const ov = $('modal-overlay');
    if (ov.hidden) return;
    ov.hidden = true;
    $('modal-fields').innerHTML = '';
    $('modal-actions').innerHTML = '';
    if (this._onKey) { document.removeEventListener('keydown', this._onKey); this._onKey = null; }
  }
};

$('modal-overlay').addEventListener('click', (e) => {
  if (e.target === $('modal-overlay')) Modal.close();
});

/* ---------------- 便捷弹窗 ---------------- */

function confirmDialog(title, desc, onConfirm, confirmLabel) {
  Modal.open({
    title,

    actions: [
      { label: '取消', kind: 'ghost' },

/* ---------------- 长按菜单 ---------------- */

const Sheet = {
  open(headTitle, headSub, items) {

};

$('sheet-overlay').addEventListener('click', (e) => {
  if (e.target === $('sheet-overlay')) Sheet.close();
});

/**
 * 绑定长按（触屏 + 鼠标），800ms 触发；触发后抑制随后的 click
 */
function bindLongPress(el, handler) {
  let timer = null, fired = false, startX = 0, startY = 0, moved = false;

  const start = (x, y) => {
    fired = false; moved = false;
    startX = x; startY = y;
    clearTimeout(timer);
    timer = setTimeout(() => {
      fired = true;
      vibrate(26);
      handler({ el, longPress: true });
    }, 520);
  };
  const move = (x, y) => {
    if (Math.abs(x - startX) > 12 || Math.abs(y - startY) > 12) {
      moved = true;
      clearTimeout(timer);
    }
  };
  const cancel = () => { clearTimeout(timer); };

  el.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    start(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  el.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1) move(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  el.addEventListener('touchend', (e) => {
    cancel();
    if (fired) { e.preventDefault(); }
  });
  el.addEventListener('touchcancel', cancel);

  // 鼠标（桌面 / 预览）
  el.addEventListener('mousedown', (e) => { if (e.button === 0) start(e.clientX, e.clientY); });
  el.addEventListener('mousemove', (e) => move(e.clientX, e.clientY));
  el.addEventListener('mouseup', cancel);
  el.addEventListener('mouseleave', cancel);

  // 长按触发后拦截 click
  el.addEventListener('click', (e) => {
    if (fired) { e.preventDefault(); e.stopPropagation(); fired = false; }
  }, true);

  el.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    vibrate(26);
    handler({ el, longPress: true });
  });
}

/* ---------------- 视图切换 ---------------- */

function showView(name) {
  document.querySelectorAll('.view').forEach((v) => v.classList.remove('active'));
  $('view-' + name).classList.add('active');
  Sheet.close();
  Modal.close();
}

/* ============================================================
   视图 1：主页 — 书本列表
   ============================================================ */

async function renderBooks() {
  const books = await Books.all();
  const wrap = $('books-list');
  const empty = $('books-empty');
  wrap.innerHTML = '';

  // 书本列表变化时同步刷新容量条
  if (typeof refreshStorage === 'function') refreshStorage();

  if (!books.length) {
    empty.hidden = false;
    return;
  }
  empty.hidden = true;

  const allNodes = [];
  for (const b of books) {
    const ns = await Nodes.byBook(b.id);
    allNodes.push(...ns);
  }

  books.forEach((b, i) => {
    const ns = allNodes.filter((n) => n.bookId === b.id);
    // 总字数只统计章节；设定另有计数，不计入小说正文总字数
    const chapters = ns.filter((n) => n.type === 'chapter');
    const settings = ns.filter((n) => n.type === 'setting');
    const words = chapters.reduce((s, n) => s + (n.wordCount || 0), 0);
    const settingWords = settings.reduce((s, n) => s + (n.wordCount || 0), 0);

    const card = document.createElement('div');
    card.className = 'book-card';
    card.style.animationDelay = Math.min(i * 45, 400) + 'ms';
    card.innerHTML = `
      <div class="book-spine">${esc((b.title || '书').trim().charAt(0) || '书')}</div>
      <div class="book-info">
        <h3>${esc(b.title)}</h3>
        <p class="${b.intro ? '' : 'placeholder'}">${esc(b.intro || '还没有介绍，长按卡片可以修改')}</p>
        <div class="book-meta">
          <span>${chapters.length} 章</span>
          <span class="dot"></span>
          <span>${words} 字</span>
          ${settings.length ? `<span class="dot"></span><span class="meta-setting">${settings.length} 条设定 · ${settingWords} 字</span>` : ''}
          <span class="dot"></span>
          <span>${fmtTime(b.updatedAt)}</span>
        </div>
      </div>`;

    card.addEventListener('click', () => openBook(b.id));
    bindLongPress(card, () => bookMenu(b));
    wrap.appendChild(card);
  });
}

function bookMenu(book) {
  Sheet.open(book.title, '书本操作', [
    {
      label: '修改标题与介绍', icon: '✎',
      onClick: () => editBookDialog(book)
    },
    {
      label: '导出为 Markdown', icon: '⬇', sub: '整本 / 仅章节',

    },
    {
      label: '导出 JSON 备份', icon: '📦', sub: '完整数据 · 可搬设备',

    {

          '删除书本',

          async () => {
            await Books.remove(book.id);

          }
        );
      }
    }
  ]);
}

function createBookDialog() {
  Modal.open({
    title: '创建小说书本',
    fields: [
      { key: 'title', label: '书名', placeholder: '例如：薰衣草色的夜晚' },
      { key: 'intro', label: '介绍', type: 'textarea', placeholder: '写一句话介绍这个故事…' }

      { label: '取消', kind: 'ghost' },
      {

function editBookDialog(book) {

$('btn-new-book').addEventListener('click', () => { vibrate(); createBookDialog(); });

/* ============================================================
   视图 2：章节管理 — 文件管理器
   ============================================================ */

async function openBook(bookId) {
  state.bookId = bookId;
  state.folderId = null;
  const book = await Books.get(bookId);
  if (!book) { toast('书本不存在'); return; }
  $('chapter-book-title').textContent = book.title;
  showView('chapters');

}

function renderChapterActions() {
  const wrap = $('chapter-actions');
  wrap.innerHTML = '';

  // 搜索
  const searchBtn = document.createElement('button');
  searchBtn.className = 'icon-btn';
  searchBtn.id = 'btn-search';
  searchBtn.title = '搜索';
  searchBtn.innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2" fill="none"/><path d="M16 16l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>';

async function renderChapters() {
  renderChapterActions();
  const all = await Nodes.byBook(state.bookId);
  state.nodesCache = all;

  const list = $('chapter-list');
  list.innerHTML = '';

  // 面包屑
  const crumbs = buildCrumbs(all);
  const bar = document.createElement('div');
  bar.className = 'breadcrumb-bar';
  crumbs.forEach((c, i) => {
    if (i > 0) {
      const sep = document.createElement('span');
      sep.className = 'crumb-sep';
      sep.textContent = '›';
      bar.appendChild(sep);
    }
    const el = document.createElement('span');
    el.className = 'crumb' + (i === crumbs.length - 1 ? ' current' : '');
    el.textContent = c.label;
    el.addEventListener('click', () => {
      state.folderId = c.id;
      renderChapters();
    });
    bar.appendChild(el);
  });
  if (state.clipboard) {
    const tag = document.createElement('span');
    tag.className = 'crumb-sep';
    tag.style.marginLeft = 'auto';
    tag.textContent = '📋 待移动';
    bar.appendChild(tag);
  }
  list.appendChild(bar);

  const children = all
    .filter((n) => n.parentId === state.folderId)
    .sort((a, b) => {
      if (a.type !== b.type) return a.type === 'folder' ? -1 : 1;
      return (a.createdAt || 0) - (b.createdAt || 0);
    });

  const parentIsRoot = state.folderId === null;

  if (!children.length) {
    const hint = document.createElement('div');
    hint.style.cssText = 'text-align:center;padding:52px 20px;color:var(--text-3);font-size:13px;';
    hint.innerHTML = `<div style="font-size:38px;opacity:.5;margin-bottom:10px">✿</div>
      这里还空着<br><span style="font-size:12px">点击右上角 ＋ 创建文件夹、章节或设定</span>`;
    list.appendChild(hint);
  }

  children.forEach((node, i) => {
    const row = document.createElement('div');
    row.className = 'fm-row fm-' + node.type;
    if (state.clipboard && state.clipboard.id === node.id) row.classList.add('move-pending');
    row.style.animationDelay = Math.min(i * 35, 350) + 'ms';

    const isFolder = node.type === 'folder';
    const isSetting = node.type === 'setting';
    const isTimeline = node.type === 'timeline';

    let sub = '';
    let tail = '';
    if (isFolder) {
      const st = Nodes.folderWordCount(node.id, all);
      const bits = [];
      if (st.chapters) bits.push(`${st.chapters} 章`);
      if (st.settings) bits.push(`${st.settings} 条设定`);
      if (st.others) bits.push(`${st.others} 份资料`);
      sub = bits.length ? bits.join(' · ') : '空文件夹';
      tail = st.words ? st.words + ' 字' : '';
    } else if (isSetting) {
      // 设定不计入小说总字数，尾部标注「设定」；显示分类条数
      const cats = (node.categories || []).length;
      sub = KIND_LABEL[node.kind || 'character'] + ' · ' + (cats ? `${cats} 个分类` : '暂无分类');
      tail = (node.wordCount || 0) + ' 字 · 设定';
    } else if (isTimeline) {
      const n = (node.events || []).length;
      sub = `${n} 个事件 · ` + fmtTime(node.updatedAt);
      tail = n ? `${n} 事件` : '暂无事件';
    } else if (node.type === 'outline') {
      sub = '故事大纲 · ' + fmtTime(node.updatedAt);
      tail = (node.wordCount || 0) + ' 字 · 大纲';
    } else {
      sub = fmtTime(node.updatedAt);
      tail = (node.wordCount || 0) + ' 字';
    }

    row.innerHTML = `
      ${state.clipboard && state.clipboard.id === node.id ? '<span class="fm-move-tag">待移动</span>' : ''}
      <span class="fm-icon">${nodeIcon(node)}</span>
      <span class="fm-main">
        <span class="fm-name">${esc(node.title)}</span>
        <span class="fm-sub">${esc(sub)}</span>
      </span>
      <span class="fm-tail">${esc(tail)}</span>
      ${isFolder
        ? '<span class="fm-chevron">›</span>'
        : '<span class="fm-chevron" style="color:var(--purple-soft);opacity:.85">✎</span>'}`;

    row.addEventListener('click', () => {
      if (isFolder) {
        state.folderId = node.id;
        renderChapters();
      } else if (isTimeline) {
        openTimeline(node.id);
      } else if (isSetting) {
        openSetting(node.id);
      } else {
        openChapter(node.id);
      }
    });
    bindLongPress(row, () => nodeMenu(node, all));
    list.appendChild(row);
  });
}

/* 设定类别元数据 */
const KIND_LABEL = { character: '人物', place: '地点', world: '世界观' };
const KIND_ICON  = { character: '👤', place: '📍', world: '🌐' };
const KIND_DESC  = {
  character: '人物档案、性格、关系',
  place: '城池、场景、地理',
  world: '规则、历史、体系'
};
/** 各类别新建分类时的建议名 */
const KIND_CAT_HINT = {
  character: '例如：性格、外貌、背景、人物关系',
  place: '例如：环境、风物、重要场景',
  world: '例如：世界规则、历史、力量体系'
};
/** 各类别新建分类的默认名 */
const KIND_CAT_DEFAULT = {
  character: '新分类',
  place: '新分类',
  world: '新分类'
};

/** 节点类型图标：文件夹 / 章节 / 设定 / 时间线 / 故事大纲 */
function nodeIcon(node) {
  switch (node.type) {
    case 'folder':   return '📁';
    case 'setting':  return KIND_ICON[node.kind || 'character'];
    case 'timeline': return '🕰';
    case 'outline':  return '🧭';
    default:         return '📄';
  }
}

/** 类型中文名 */
function typeLabel(node) {
  switch (node.type) {
    case 'folder':   return '文件夹';
    case 'setting':  return `${KIND_LABEL[node.kind || 'character']}设定`;
    case 'timeline': return '时间线';
    case 'outline':  return '故事大纲';
    default:         return '章节';
  }
}

/** 标题为空时的兜底名（按节点类型） */
function defaultTitle(node) {
  if (!node) return '未命名';
  switch (node.type) {
    case 'setting':  return '新' + KIND_LABEL[node.kind || 'character'];
    case 'folder':   return '新建文件夹';
    case 'timeline': return '新时间线';
    case 'outline':  return '新大纲';
    default:         return '未命名章节';
  }
}

function buildCrumbs(all) {
  const crumbs = [{ id: null, label: '根目录' }];
  if (state.folderId) {
    const chain = [];
    let cur = all.find((n) => n.id === state.folderId);
    const guard = new Set();
    while (cur && !guard.has(cur.id)) {
      guard.add(cur.id);
      chain.unshift({ id: cur.id, label: cur.title });
      cur = cur.parentId ? all.find((n) => n.id === cur.parentId) : null;
    }
    crumbs.push(...chain);
  }
  return crumbs;
}

/* ---------------- 创建（文件夹 / 章节 / 设定 / 时间线 / 大纲） ---------------- */

/** 选择设定类型：人物 / 地点 / 世界观 */

/* ---------------- 长按菜单 ---------------- */

function nodeMenu(node, all) {
  const items = [
    {
      label: '重命名', icon: '✎',
      onClick: () => {
        promptDialog('重命名', [
          { key: 'title', label: node.type === 'folder' ? '文件夹名称'
              : node.type === 'setting' ? KIND_LABEL[node.kind || 'character'] + '名称'
              : node.type === 'timeline' ? '时间线名称'
              : node.type === 'outline' ? '大纲名称'
              : '章节标题', value: node.title }
        ], async (v) => {
          if (!v.title) { toast('名称不能为空'); return; }
          await Nodes.update(node.id, { title: v.title });
          toast('已重命名');
          renderChapters();
        }, '保存');
      }
    },
    {
      label: '移动', icon: '✂', sub: '复制到剪贴板',
      onClick: () => {
        state.clipboard = { id: node.id, type: node.type };
        toast(`已剪切「${node.title}」，长按目标文件夹粘贴`);
        renderChapters();
      }
    }
  ];

  // 粘贴：仅文件夹长按菜单上显示，且必须存在移动剪贴板
  if (node.type === 'folder' && state.clipboard) {
    const clip = state.clipboard;
    const src = all.find((n) => n.id === clip.id);
    const illegal =
      !src ||
      src.id === node.id ||                              // 不能粘贴到自己
      Nodes.isAncestorOf(src.id, node.id, all) ||        // 不能粘贴进自己的子目录
      src.parentId === node.id;                          // 已在目标目录内

    items.push({
      label: '粘贴', icon: '📋', kind: 'paste',
      sub: src ? `移动「${src.title}」到此处` : '',
      onClick: async () => {
        if (illegal) { toast('无法移动到该位置'); return; }
        await Nodes.move(clip.id, node.id);
        state.clipboard = null;
        await Books.touch(state.bookId);
        toast(`已移动到「${node.title}」`);
        renderChapters();
      }
    });
  }

  items.push({
    label: '删除', icon: '🗑', kind: 'danger',
    onClick: () => {
      const extra = node.type === 'folder' ? '文件夹内的所有内容也会一并删除。' : '';
      confirmDialog(
        '确认删除',
        `确定删除「${node.title}」吗？${extra}此操作无法恢复。`,
        async () => {
          await Nodes.remove(node.id);
          if (state.clipboard && state.clipboard.id === node.id) state.clipboard = null;
          await Books.touch(state.bookId);
          toast('已删除');
          renderChapters();
        }
      );
    }
  });

  Sheet.open(node.title, typeLabel(node), items);
}

/* ============================================================
   视图 3：写作编辑器
   ============================================================ */

let editorNode = null;
let saveTimer = null;
let titleSaveTimer = null;
let editorBusy = false;   // 正在切换节点时抑制 blur 写入

/** 切换节点前，把当前编辑内容落库（避免丢失 / 写错对象） */
async function flushEditor() {
  if (!editorNode) return;
  clearTimeout(saveTimer);
  clearTimeout(titleSaveTimer);
  const target = editorNode.id;
  const text = $('editor-body').value;
  const n = countWords(text);
  const rawTitle = $('editor-title').value.trim();
  const title = rawTitle || defaultTitle(editorNode);
  const node = await Nodes.get(target);
  if (!node) return;
  await Nodes.update(target, { content: text, wordCount: n, title });
  await Books.touch(node.bookId);
}

async function openChapter(nodeId) {
  // 若已打开另一个节点，先保存它，再切换
  if (editorNode && editorNode.id !== nodeId) {
    editorBusy = true;
    try { await flushEditor(); } finally { editorBusy = false; }
  }
  const node = await Nodes.get(nodeId);
  if (!node) { toast('内容不存在'); return; }
  // 时间线与设定走各自的独立编辑器
  if (node.type === 'timeline') { openTimeline(nodeId); return; }
  if (node.type === 'setting') { openSetting(nodeId); return; }

  editorNode = node;
  state.chapterId = nodeId;

  $('editor-title').value = node.title || '';
  $('editor-title').placeholder = node.type === 'outline' ? '大纲名称' : '章节标题';
  $('editor-body').placeholder = node.type === 'outline'
    ? '全书脉络、分卷结构、关键转折、结局走向……'
    : '在这里写下你的故事……\n\n夜色如薰衣草般铺开。';
  $('editor-body').value = node.content || '';

  // 顶栏标示当前类型
  const tag = $('editor-kind-tag');
  if (node.type === 'outline') {
    tag.textContent = '🧭 故事大纲';
    tag.hidden = false;
  } else {
    tag.hidden = true;
  }

  updateEditorCount(node.wordCount || 0);
  setEditorStatus('已保存');
  showView('editor');

  // 进入时若标题仍是默认值，选中方便直接覆盖
  setTimeout(() => {
    const body = $('editor-body');
    if (!body.value) body.focus();
  }, 120);
}

function updateEditorCount(n) {
  const chip = $('editor-count');
  chip.innerHTML = `<b>${n}</b><span>字</span>`;
  chip.classList.remove('pulse');
  void chip.offsetWidth;
  chip.classList.add('pulse');
}

function setEditorStatus(text) {
  const el = $('editor-status');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(setEditorStatus._t);
  setEditorStatus._t = setTimeout(() => el.classList.remove('show'), 1600);
}

/* ---- 正文输入：实时字数 + 自动保存 ---- */
$('editor-body').addEventListener('input', () => {
  if (!editorNode) return;
  const target = editorNode.id;          // 快照节点，防止切换后写错对象
  const text = $('editor-body').value;
  const n = countWords(text);
  $('editor-count').innerHTML = `<b>${n}</b><span>字</span>`;

  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    if (!editorNode || editorNode.id !== target) return;
    await Nodes.update(target, { content: text, wordCount: n });
    if (editorNode && editorNode.id === target) {
      editorNode.content = text;
      editorNode.wordCount = n;
    }
    const fresh = await Nodes.get(target);
    if (fresh) await Books.touch(fresh.bookId);
    if (editorNode && editorNode.id === target) {
      setEditorStatus('已自动保存 · ' + fmtTime(Date.now()).slice(11));
    }
  }, 600);
});

/* ---- 正文失焦立即保存 ---- */
$('editor-body').addEventListener('blur', async () => {
  if (!editorNode || editorBusy) return;
  // 快照当前节点，异步过程中若已切走则放弃，避免把空内容写到新节点
  const target = editorNode.id;
  clearTimeout(saveTimer);
  const text = $('editor-body').value;
  const n = countWords(text);
  await Nodes.update(target, { content: text, wordCount: n });
  if (editorNode && editorNode.id === target) {
    editorNode.content = text;
    editorNode.wordCount = n;
    setEditorStatus('已保存');
  }
});

/* ---- 标题输入：内外同步（延迟写库，返回列表即在） ---- */
$('editor-title').addEventListener('input', () => {
  if (!editorNode) return;
  const target = editorNode.id;
  const title = $('editor-title').value;
  clearTimeout(titleSaveTimer);
  titleSaveTimer = setTimeout(async () => {
    if (!editorNode || editorNode.id !== target) return;
    const v = title.trim() || defaultTitle(editorNode);
    await Nodes.update(target, { title: v });
    if (editorNode && editorNode.id === target) {
      editorNode.title = v;
      setEditorStatus('标题已保存');
    }
  }, 400);
});

$('editor-title').addEventListener('blur', async () => {
  if (!editorNode) return;
  clearTimeout(titleSaveTimer);
  let title = $('editor-title').value.trim();
  if (!title) { title = defaultTitle(editorNode); $('editor-title').value = title; }
  await Nodes.update(editorNode.id, { title });
  editorNode.title = title;
  await Books.touch(editorNode.bookId);
});

$('editor-title').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); $('editor-body').focus(); }
});

/* ---- 返回章节列表：先落库，保证字数同步 ---- */
$('btn-back-chapters').addEventListener('click', async () => {
  vibrate();
  await flushEditor();
  editorNode = null;
  state.chapterId = null;
  showView('chapters');
  await renderChapters();
});

window.addEventListener('beforeunload', () => {
  if (editorNode) {
    const text = $('editor-body').value;
    const n = countWords(text);
    Nodes.update(editorNode.id, { content: text, wordCount: n });

});

document.addEventListener('visibilitychange', () => {

    const text = $('editor-body').value;
    const n = countWords(text);
    Nodes.update(editorNode.id, { content: text, wordCount: n });
  }

<script>
/* ============================================================
   视图 4：时间线编辑器（事件列表）
   左：时间（窄）  右：事件文本（宽）
   ============================================================ */

let timelineNode = null;
let tlSaveTimer = null;
let tlTitleTimer = null;
let tlBusy = false;

/** 事件字数合计（时间 + 事件文本） */
function timelineWordCount(node) {
  let n = 0;
  (node.events || []).forEach((ev) => {
    n += countWords(ev.text || '');
  });
  return n;
}

function newEventId() {
  return 'ev-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
}

async function openTimeline(nodeId) {
  if (timelineNode && timelineNode.id !== nodeId) {
    tlBusy = true;
    try { await flushTimeline(); } finally { tlBusy = false; }
  }
  const node = await Nodes.get(nodeId);
  if (!node) { toast('时间线不存在'); return; }
  if (!Array.isArray(node.events)) node.events = [];
  timelineNode = node;
  state.chapterId = nodeId;

  $('timeline-title').value = node.title || '';
  renderTimelineEvents();
  showView('timeline');

  if (!node.events.length) {
    setTimeout(() => addEvent(true), 260);
  }
}

function renderTimelineEvents() {
  const list = $('timeline-list');
  list.innerHTML = '';
  const events = (timelineNode && timelineNode.events) || [];

  if (!events.length) {
    const empty = document.createElement('div');
    empty.className = 'tl-empty';
    empty.innerHTML = '<span class="ti">🕰</span>还没有事件<br><span style="font-size:12px">点击右上角 ＋ 创建新事件</span>';
    list.appendChild(empty);
    return;
  }

  events.forEach((ev, i) => {
    const row = document.createElement('div');
    row.className = 'tl-row';
    row.style.animationDelay = Math.min(i * 30, 300) + 'ms';

    const time = document.createElement('input');
    time.className = 'tl-time';
    time.type = 'text';
    time.value = ev.time || '';
    time.placeholder = '时间';
    time.autocomplete = 'off';
    time.spellcheck = false;

    const text = document.createElement('textarea');
    text.className = 'tl-text';
    text.rows = 1;
    text.value = ev.text || '';
    text.placeholder = '发生了什么……';
    text.spellcheck = false;

    const del = document.createElement('button');
    del.className = 'tl-del';
    del.type = 'button';
    del.title = '删除事件';
    del.textContent = '✕';

    // 自适应高度
    const autosize = () => {
      text.style.height = 'auto';
      text.style.height = Math.max(42, text.scrollHeight) + 'px';
    };

    time.addEventListener('input', () => {
      ev.time = time.value;
      scheduleTimelineSave();
    });

    text.addEventListener('input', () => {
      ev.text = text.value;
      autosize();
      scheduleTimelineSave();
    });
    text.addEventListener('blur', () => {
      if (tlBusy) return;
      tlSaveNow();
    });
    text.addEventListener('keydown', (e) => {
      // Enter 新建下一个事件，方便连续录入
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        addEvent(false, i + 1);
      }
    });

    del.addEventListener('click', () => {
      vibrate();
      const preview = (ev.text || '').trim().slice(0, 14) || (ev.time || '').trim() || '这条事件';
      confirmDialog('删除事件', `确定删除「${preview}」吗？此操作无法恢复。`, async () => {
        const idx = timelineNode.events.findIndex((x) => x.id === ev.id);
        if (idx > -1) timelineNode.events.splice(idx, 1);
        await tlSaveNow();
        renderTimelineEvents();
        toast('事件已删除');
      });
    });

    row.appendChild(time);
    row.appendChild(text);
    row.appendChild(del);
    list.appendChild(row);
    autosize();
  });

  const hint = document.createElement('div');
  hint.className = 'tl-hint';
  hint.textContent = '按 Enter 快速添加下一个事件 · Shift+Enter 换行';
  list.appendChild(hint);
}

/** 在指定位置插入新事件并聚焦 */
async function addEvent(focusFirst, atIndex) {
  if (!timelineNode) return;
  timelineNode.events = timelineNode.events || [];
  const ev = { id: newEventId(), time: '', text: '' };
  const idx = (typeof atIndex === 'number') ? atIndex : timelineNode.events.length;
  timelineNode.events.splice(idx, 0, ev);
  renderTimelineEvents();
  await tlSaveNow();

  const rows = document.querySelectorAll('.tl-row');
  const target = rows[focusFirst ? 0 : Math.min(idx, rows.length - 1)];
  if (target) {
    const firstInput = focusFirst ? target.querySelector('.tl-time') : target.querySelector('.tl-text');
    firstInput.focus();
  }
}

function scheduleTimelineSave() {
  clearTimeout(tlSaveTimer);
  tlSaveTimer = setTimeout(tlSaveNow, 600);
}

async function tlSaveNow() {
  if (!timelineNode) return;
  clearTimeout(tlSaveTimer);
  const target = timelineNode.id;
  const events = timelineNode.events || [];
  const words = timelineWordCount({ events });
  const title = $('timeline-title').value.trim() || '新时间线';
  const node = await Nodes.get(target);
  if (!node) return;
  await Nodes.update(target, { events, wordCount: words, title });
  if (timelineNode && timelineNode.id === target) timelineNode.wordCount = words;
  await Books.touch(node.bookId);
}

/** 离开时间线前落库 */
async function flushTimeline() {
  if (!timelineNode) return;
  clearTimeout(tlSaveTimer);
  clearTimeout(tlTitleTimer);
  await tlSaveNow();
}

/* ---- 标题防抖保存 ---- */
$('timeline-title').addEventListener('input', () => {
  if (!timelineNode) return;
  const target = timelineNode.id;
  const val = $('timeline-title').value;
  clearTimeout(tlTitleTimer);
  tlTitleTimer = setTimeout(async () => {
    if (!timelineNode || timelineNode.id !== target) return;
    await Nodes.update(target, { title: val.trim() || '新时间线' });
    const fresh = await Nodes.get(target);
    if (fresh) await Books.touch(fresh.bookId);
  }, 400);
});

$('timeline-title').addEventListener('blur', async () => {
  if (!timelineNode || tlBusy) return;
  clearTimeout(tlTitleTimer);
  let v = $('timeline-title').value.trim();
  if (!v) { v = '新时间线'; $('timeline-title').value = v; }
  await Nodes.update(timelineNode.id, { title: v });
});

$('timeline-title').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const first = document.querySelector('.tl-time');
    if (first) first.focus();
  }
});

/* ---- 顶栏：创建新事件 ---- */
$('btn-new-event').addEventListener('click', async () => {
  vibrate();
  if (!timelineNode) return;
  await addEvent(false);
  toast('已添加事件');
});

/* ---- 返回章节列表 ---- */
$('btn-back-timeline').addEventListener('click', async () => {
  vibrate();
  tlBusy = true;
  try { await flushTimeline(); } finally { tlBusy = false; }
  timelineNode = null;
  state.chapterId = null;
  showView('chapters');
  await renderChapters();
});
