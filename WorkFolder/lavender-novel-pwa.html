<script>
/* ============================================================
   视图 5：设定编辑器（分类列表）
   每个分类 = 头部（分类名） + 下方内容区
   字数统计只算所有分类的内容
   ============================================================ */

let settingNode = null;
let setSaveTimer = null;
let setTitleTimer = null;
let setBusy = false;

function newCategoryId() {
  return 'cat-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
}

/** 只统计所有分类的「内容」字数，不含分类名 */
function settingContentWords(node) {
  let n = 0;
  (node.categories || []).forEach((c) => { n += countWords(c.content || ''); });
  return n;
}

async function openSetting(nodeId) {
  if (settingNode && settingNode.id !== nodeId) {
    setBusy = true;
    try { await flushSetting(); } finally { setBusy = false; }
  }
  const node = await Nodes.get(nodeId);
  if (!node) { toast('设定不存在'); return; }
  if (!Array.isArray(node.categories)) node.categories = [];
  settingNode = node;
  state.chapterId = nodeId;

  const kind = node.kind || 'character';
  $('setting-title').value = node.title || '';
  $('setting-title').placeholder = KIND_LABEL[kind] + '名称';
  const tag = $('setting-kind-tag');
  tag.textContent = KIND_ICON[kind] + ' ' + KIND_LABEL[kind] + '设定';

  renderCategories();
  updateSettingCount(settingContentWords(node), false);
  showView('setting');
}

function updateSettingCount(n, pulse) {
  const chip = $('setting-count');
  chip.innerHTML = `<b>${n}</b><span>字</span>`;
  if (pulse) {
    chip.classList.remove('pulse');
    void chip.offsetWidth;
    chip.classList.add('pulse');
  }
}

function renderCategories() {
  const list = $('category-list');
  list.innerHTML = '';
  const cats = (settingNode && settingNode.categories) || [];

  if (!cats.length) {
    const empty = document.createElement('div');
    empty.className = 'set-empty';
    empty.innerHTML = '<span class="si">✿</span>还没有分类<br><span style="font-size:12px">点击右上角 ＋ 创建第一个分类</span>';
    list.appendChild(empty);
    return;
  }

  cats.forEach((cat, i) => {
    const card = document.createElement('div');
    card.className = 'cat-card';
    card.style.animationDelay = Math.min(i * 40, 320) + 'ms';

    // ---- 头部：分类名 ----
    const head = document.createElement('div');
    head.className = 'cat-head';

    const name = document.createElement('input');
    name.className = 'cat-name';
    name.type = 'text';
    name.value = cat.name || '';
    name.placeholder = '分类名称';
    name.autocomplete = 'off';

    const word = document.createElement('span');
    word.className = 'cat-word';
    word.textContent = countWords(cat.content || '') + ' 字';

    const del = document.createElement('button');
    del.className = 'cat-del';
    del.type = 'button';
    del.title = '删除分类';
    del.textContent = '✕';

    head.appendChild(name);
    head.appendChild(word);
    head.appendChild(del);

    // ---- 内容区 ----
    const body = document.createElement('textarea');
    body.className = 'cat-body';
    body.rows = 3;
    body.value = cat.content || '';
    body.placeholder = '在这里写「' + (cat.name || '本分类') + '」的内容……';
    body.spellcheck = false;

    const autosize = () => {
      body.style.height = 'auto';
      body.style.height = Math.max(76, body.scrollHeight) + 'px';
    };

    name.addEventListener('input', () => {
      cat.name = name.value;
      body.placeholder = '在这里写「' + (name.value.trim() || '本分类') + '」的内容……';
      scheduleSettingSave();
    });
    name.addEventListener('blur', () => {
      if (setBusy) return;
      if (!name.value.trim()) {
        name.value = '未命名分类';
        cat.name = name.value;
      }
      setSaveNow();
    });
    name.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); body.focus(); }
    });

    body.addEventListener('input', () => {
      cat.content = body.value;
      const w = countWords(body.value);
      word.textContent = w + ' 字';
      autosize();
      // 实时更新顶栏总字数
      updateSettingCount(settingContentWords(settingNode), true);
      scheduleSettingSave();
    });
    body.addEventListener('blur', () => {
      if (setBusy) return;
      setSaveNow();
    });

    del.addEventListener('click', () => {
      vibrate();
      const label = (cat.name || '').trim() || '本分类';
      confirmDialog('删除分类', `确定删除「${label}」吗？该分类的内容会一并删除，无法恢复。`, async () => {
        const idx = settingNode.categories.findIndex((c) => c.id === cat.id);
        if (idx > -1) settingNode.categories.splice(idx, 1);
        await setSaveNow();
        renderCategories();
        updateSettingCount(settingContentWords(settingNode), true);
        toast('分类已删除');
      });
    });

    card.appendChild(head);
    card.appendChild(body);
    list.appendChild(card);
    autosize();
  });

  const hint = document.createElement('div');
  hint.className = 'set-hint';
  hint.textContent = '字数统计只计入各分类的内容';
  list.appendChild(hint);
}

/** 顶栏「＋」创建分类 */
function createCategoryDialog() {
  if (!settingNode) return;
  const kind = settingNode.kind || 'character';
  promptDialog('创建分类', [
    {
      key: 'name',
      label: '分类名称',
      value: '',
      placeholder: KIND_CAT_HINT[kind]
    }
  ], async (v) => {
    const name = (v.name || '').trim();
    if (!name) { toast('请输入分类名称'); return; }
    settingNode.categories.push({ id: newCategoryId(), name, content: '' });
    await setSaveNow();
    renderCategories();
    // 聚焦到新分类的内容区
    const areas = document.querySelectorAll('.cat-body');
    const target = areas[areas.length - 1];
    if (target) {
      target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      target.focus();
    }
    toast('分类已创建');
  }, '创建');
}

function scheduleSettingSave() {
  clearTimeout(setSaveTimer);
  setSaveTimer = setTimeout(setSaveNow, 600);
}

async function setSaveNow() {
  if (!settingNode) return;
  clearTimeout(setSaveTimer);
  const target = settingNode.id;
  const categories = settingNode.categories || [];
  const words = settingContentWords({ categories });
  const title = $('setting-title').value.trim() || ('新' + KIND_LABEL[settingNode.kind || 'character']);

  // 分类名称为空的兜底
  categories.forEach((c) => { if (!c.name || !c.name.trim()) c.name = '未命名分类'; });

  const node = await Nodes.get(target);
  if (!node) return;
  await Nodes.update(target, { categories, wordCount: words, title });
  if (settingNode && settingNode.id === target) settingNode.wordCount = words;
  await Books.touch(node.bookId);
  updateSettingCount(words, false);
}

/** 离开设定前落库 */
async function flushSetting() {
  if (!settingNode) return;
  clearTimeout(setSaveTimer);
  clearTimeout(setTitleTimer);
  await setSaveNow();
}

/* ---- 标题防抖保存 ---- */
$('setting-title').addEventListener('input', () => {
  if (!settingNode) return;
  const target = settingNode.id;
  const val = $('setting-title').value;
  clearTimeout(setTitleTimer);
  setTitleTimer = setTimeout(async () => {
    if (!settingNode || settingNode.id !== target) return;
    const fallback = '新' + KIND_LABEL[settingNode.kind || 'character'];
    await Nodes.update(target, { title: val.trim() || fallback });
    const fresh = await Nodes.get(target);
    if (fresh) await Books.touch(fresh.bookId);
  }, 400);
});

$('setting-title').addEventListener('blur', async () => {
  if (!settingNode || setBusy) return;
  clearTimeout(setTitleTimer);
  let v = $('setting-title').value.trim();
  if (!v) { v = '新' + KIND_LABEL[settingNode.kind || 'character']; $('setting-title').value = v; }
  await Nodes.update(settingNode.id, { title: v });
});

$('setting-title').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const first = document.querySelector('.cat-body');
    if (first) first.focus();
  }
});

/* ---- 顶栏：创建分类 ---- */
$('btn-new-category').addEventListener('click', () => { vibrate(); createCategoryDialog(); });

/* ---- 返回章节列表 ---- */
$('btn-back-setting').addEventListener('click', async () => {
  vibrate();
  setBusy = true;
  try { await flushSetting(); } finally { setBusy = false; }
  settingNode = null;
  state.chapterId = null;
  showView('chapters');
  await renderChapters();
});
</script>
<script>
/* ============================================================
   导出：单个 Markdown 文件
   两种范围：
     full    —— 整本全部内容（章节 + 文件夹 + 设定 + 时间线 + 大纲）
     basic   —— 只导出文件夹和章节两样
   ============================================================ */

/** 文件名净化 */
function safeFileName(name) {
  return String(name || '未命名')
    .replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_')
    .replace(/^\s+|\s+$/g, '')
    .slice(0, 80) || '未命名';
}

/** 时间戳 YYYYMMDD-HHmm */
function stamp() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}

/** 按节点树渲染（递归），返回 markdown 行数组 */
function renderTree(bookId, parentId, all, opts, depth, lines) {
  const kids = all
    .filter((n) => (n.parentId || null) === (parentId || null))
    .sort((a, b) => {
      if (a.type !== b.type) return a.type === 'folder' ? -1 : 1;
      return (a.createdAt || 0) - (b.createdAt || 0);
    });

  for (const node of kids) {
    if (node.type === 'folder') {
      // 文件夹标题层级：从 ## 开始，每层递进，最深到 #####
      const lvl = Math.min(2 + depth, 5);
      lines.push('');
      lines.push('#'.repeat(lvl) + ' ' + node.title);
      lines.push('');
      renderTree(bookId, node.id, all, opts, depth + 1, lines);

    } else if (node.type === 'chapter') {
      // 章节比同级文件夹深一级；嵌套过深时封顶，避免标题层级失控
      const lvl = Math.min(depth === 0 ? 2 : depth + 2, 4);
      lines.push('');
      lines.push('#'.repeat(lvl) + ' ' + node.title);
      lines.push('');
      const body = (node.content || '').trim();
      lines.push(body || '_（本章暂无内容）_');
      lines.push('');

    } else if (node.type === 'outline' && opts.includeExtras) {
      lines.push('');
      lines.push('#'.repeat(Math.min(depth === 0 ? 2 : depth + 2, 4)) + ' 🧭 ' + node.title + '（故事大纲）');
      lines.push('');
      lines.push((node.content || '').trim() || '_（暂无内容）_');
      lines.push('');

    } else if (node.type === 'timeline' && opts.includeExtras) {
      lines.push('');
      lines.push('#'.repeat(Math.min(depth === 0 ? 2 : depth + 2, 4)) + ' 🕰 ' + node.title + '（时间线）');
      lines.push('');
      const evs = node.events || [];
      if (!evs.length) {
        lines.push('_（暂无事件）_');
      } else {
        evs.forEach((ev) => {
          const t = (ev.time || '').trim() || '—';
          const x = (ev.text || '').trim() || '';
          lines.push(`- **${t}**　${x}`);
        });
      }
      lines.push('');

    } else if (node.type === 'setting' && opts.includeExtras) {
      const kind = KIND_LABEL[node.kind || 'character'];
      lines.push('');
      lines.push('#'.repeat(Math.min(depth === 0 ? 2 : depth + 2, 4)) + ' ' +
        KIND_ICON[node.kind || 'character'] + ' ' + node.title + '（' + kind + '设定）');
      lines.push('');
      const cats = node.categories || [];
      if (!cats.length) {
        lines.push('_（暂无分类）_');
      } else {
        cats.forEach((c) => {
          // 分类名固定为 H5，稳在设定标题之下
          lines.push('##### ' + (c.name || '未命名分类'));
          lines.push('');
          lines.push((c.content || '').trim() || '_（暂无内容）_');
          lines.push('');
        });
      }
      lines.push('');
    }
  }
  return lines;
}

/** 生成整本 markdown */
function buildMarkdown(book, all, opts) {
  const lines = [];
  const now = new Date();
  const p = (n) => String(n).padStart(2, '0');

  lines.push('# ' + book.title);
  lines.push('');
  if (book.intro) {
    lines.push('> ' + book.intro.replace(/\n/g, '\n> '));
    lines.push('');
  }

  // 统计
  const chapters = all.filter((n) => n.type === 'chapter');
  const words = chapters.reduce((s, n) => s + (n.wordCount || 0), 0);
  const meta = [`共 ${chapters.length} 章`, `${words} 字`];
  if (opts.includeExtras) {
    const st = all.filter((n) => n.type === 'setting').length;
    const tl = all.filter((n) => n.type === 'timeline').length;
    const ol = all.filter((n) => n.type === 'outline').length;
    if (st) meta.push(`${st} 条设定`);
    if (tl) meta.push(`${tl} 条时间线`);
    if (ol) meta.push(`${ol} 份大纲`);
  }
  lines.push('*' + meta.join(' · ') + '*');
  lines.push('');
  lines.push(`*导出时间：${now.getFullYear()}-${p(now.getMonth() + 1)}-${p(now.getDate())} ${p(now.getHours())}:${p(now.getMinutes())}*`);
  lines.push('');
  lines.push('---');

  renderTree(book.id, null, all, opts, 0, lines);

  // 收尾：折叠多余空行
  let out = lines.join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
  return out;
}

/** 选择导出范围 */
function exportDialog(book) {
  Modal.open({
    title: '导出为 Markdown',
    desc: `《${book.title}》导出为单个 .md 文件`,
    choices: [
      {
        icon: '📚', label: '导出整本全部内容',
        hint: '章节 + 文件夹 + 设定 + 时间线 + 大纲',
        onClick: () => doExport(book, { includeExtras: true })
      },
      {
        icon: '📄', label: '只导出文件夹和章节',
        hint: '不含设定、时间线、故事大纲',
        onClick: () => doExport(book, { includeExtras: false })
      }
    ],
    actions: [{ label: '取消', kind: 'ghost' }]
  });
}

/** 执行导出（浏览器下载） */
async function doExport(book, opts) {
  try {
    const all = await Nodes.byBook(book.id);
    if (!all.length) { toast('这本书还是空的'); return; }

    const md = buildMarkdown(book, all, opts);
    const filename = safeFileName(book.title) + (opts.includeExtras ? '' : '-章节') + '-' + stamp() + '.md';
    const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });

    // APK 环境优先走原生桥（写到系统「下载」目录）
    if (typeof saveBlobNative === 'function' && saveBlobNative(blob, filename)) {
      toast(`已导出 ${filename}`);
      return;
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);

    toast(`已导出 ${filename}`);
  } catch (e) {
    console.error(e);
    toast('导出失败：' + e.message);
  }
}
</script>
<script>
/* ============================================================
   JSON 导出 / 导入 —— 整本书完整备份
   用于备份，或把书搬到其他设备 / 其他浏览器
   ============================================================ */

const BACKUP_FORMAT = 'lavender-novel-book';
const BACKUP_VERSION = 1;

/* ---------------- 导出 ---------------- */

/** 导出整本书为 JSON 文件 */
async function exportJson(book) {
  try {
    const nodes = await Nodes.byBook(book.id);
    const payload = {
      format: BACKUP_FORMAT,
      version: BACKUP_VERSION,
      exportedAt: new Date().toISOString(),
      book: {
        title: book.title,
        intro: book.intro || '',
        createdAt: book.createdAt || null,
        updatedAt: book.updatedAt || null
      },
      // 保留原始 id，便于导入时还原层级
      nodes
    };

    const json = JSON.stringify(payload, null, 2);
    const filename = safeFileName(book.title) + '-' + stamp() + '.json';
    const blob = new Blob([json], { type: 'application/json;charset=utf-8' });

    const chapters = nodes.filter((n) => n.type === 'chapter').length;

    // APK 环境优先走原生桥（写到系统「下载」目录）
    if (typeof saveBlobNative === 'function' && saveBlobNative(blob, filename)) {
      toast(`已导出 ${filename}（${chapters} 章）`);
      return;
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);

    toast(`已导出 ${filename}（${chapters} 章）`);
  } catch (e) {
    console.error(e);
    toast('导出失败：' + e.message);
  }
}

/* ---------------- 导入 ---------------- */

/** 触发文件选择 */
function pickJsonFile() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.style.display = 'none';
  input.addEventListener('change', async () => {
    const file = input.files && input.files[0];
    if (file) await handleJsonFile(file);
    document.body.removeChild(input);
  });
  document.body.appendChild(input);
  input.click();
}

/** 校验并预览，再确认导入 */
async function handleJsonFile(file) {
  let payload;
  try {
    const text = await file.text();
    payload = JSON.parse(text);
  } catch (e) {
    confirmDialog('无法读取文件', '这个文件不是有效的 JSON，可能已损坏。', null, '知道了');
    return;
  }

  const err = validateBackup(payload);
  if (err) {
    confirmDialog('备份文件无效', err, null, '知道了');
    return;
  }

  const nodes = payload.nodes || [];
  const chapters = nodes.filter((n) => n.type === 'chapter').length;
  const folders = nodes.filter((n) => n.type === 'folder').length;
  const settings = nodes.filter((n) => n.type === 'setting').length;
  const timelines = nodes.filter((n) => n.type === 'timeline').length;
  const outlines = nodes.filter((n) => n.type === 'outline').length;
  const words = nodes
    .filter((n) => n.type === 'chapter')
    .reduce((s, n) => s + (n.wordCount || 0), 0);

  const bits = [`${chapters} 章`, `${words} 字`];
  if (folders) bits.push(`${folders} 个文件夹`);
  if (settings) bits.push(`${settings} 条设定`);
  if (timelines) bits.push(`${timelines} 条时间线`);
  if (outlines) bits.push(`${outlines} 份大纲`);

  const bookTitle = (payload.book && payload.book.title) || '未命名';
  Modal.open({
    title: '导入书本',
    desc: `《${bookTitle}》\n${bits.join(' · ')}\n\n导入后会作为一本新书加入书阁，原有书本不受影响。`,
    actions: [
      { label: '取消', kind: 'ghost' },
      {
        label: '导入', kind: 'primary',
        onClick: () => doImport(payload)
      }
    ]
  });
}

/** 按实际内容重算整本书的字数（导入后调用，不信任文件里的旧值） */
async function recountBook(bookId) {
  const nodes = await Nodes.byBook(bookId);
  await tx('nodes', 'readwrite', (s) => {
    nodes.forEach((n) => {
      let words = null;
      if (n.type === 'chapter' || n.type === 'outline') {
        words = countWords(n.content || '');
      } else if (n.type === 'setting') {
        words = 0;
        (n.categories || []).forEach((c) => { words += countWords(c.content || ''); });
      } else if (n.type === 'timeline') {
        words = 0;
        (n.events || []).forEach((e) => { words += countWords(e.text || ''); });
      } else if (n.type === 'folder') {
        words = 0;
      }
      if (words !== null && words !== n.wordCount) {
        n.wordCount = words;
        s.put(n);
      }
    });
    return null;
  });
}

/** 校验备份结构，返回错误说明或 null */
function validateBackup(payload) {
  if (!payload || typeof payload !== 'object') return '文件内容为空或格式不对。';
  if (payload.format !== BACKUP_FORMAT) {
    return '这不是本编辑器导出的书本备份文件。';
  }
  if (payload.version > BACKUP_VERSION) {
    return `备份版本（v${payload.version}）比当前应用更新，请升级后再导入。`;
  }
  if (!payload.book || typeof payload.book.title !== 'string') {
    return '备份里缺少书本信息。';
  }
  if (!Array.isArray(payload.nodes)) {
    return '备份里缺少内容节点。';
  }
  return null;
}

/** 执行导入：id 全部重映射，避免与现有数据冲突 */
async function doImport(payload) {
  try {
    const src = payload.nodes || [];
    const validTypes = new Set(['folder', 'chapter', 'setting', 'timeline', 'outline']);

    // 1) 新建书本
    const book = await Books.add(
      payload.book.title + (payload.book.title ? '（导入）' : '未命名（导入）'),
      payload.book.intro || ''
    );

    // 2) 建立 旧id -> 新id 映射
    const idMap = {};
    src.forEach((n) => {
      if (n && n.id) idMap[n.id] = uid('n');
    });

    // 3) 逐个写入，parentId 一并重映射
    const now = Date.now();
    let count = 0;
    for (const n of src) {
      if (!n || !n.id) continue;
      const type = validTypes.has(n.type) ? n.type : 'chapter';
      const node = {
        id: idMap[n.id],
        bookId: book.id,
        parentId: (n.parentId && idMap[n.parentId]) ? idMap[n.parentId] : null,
        type,
        title: typeof n.title === 'string' && n.title ? n.title : '未命名',
        createdAt: n.createdAt || now,
        updatedAt: n.updatedAt || now
      };

      if (type === 'folder') {
        node.content = '';
        node.wordCount = 0;
      } else if (type === 'chapter' || type === 'outline') {
        node.content = typeof n.content === 'string' ? n.content : '';
        node.wordCount = n.wordCount || 0;
      } else if (type === 'setting') {
        node.kind = ['character', 'place', 'world'].includes(n.kind) ? n.kind : 'character';
        node.categories = Array.isArray(n.categories)
          ? n.categories.map((c) => ({
              id: c && c.id ? c.id : uid('cat'),
              name: (c && c.name) || '未命名分类',
              content: (c && c.content) || ''
            }))
          : [];
        node.wordCount = n.wordCount || 0;
      } else if (type === 'timeline') {
        node.events = Array.isArray(n.events)
          ? n.events.map((e) => ({
              id: e && e.id ? e.id : uid('ev'),
              time: (e && e.time) || '',
              text: (e && e.text) || ''
            }))
          : [];
        node.wordCount = n.wordCount || 0;
      }

      await Nodes.putRaw(node);
      count++;
    }

    // 4) 悬空 parentId 兜底：父节点不存在则挂到根目录
    await Nodes.repairOrphans(book.id);

    // 5) 重算字数：不信任备份里的旧值，按实际内容重新统计
    await recountBook(book.id);

    await Books.touch(book.id);
    await renderBooks();
    toast(`已导入《${book.title}》，共 ${count} 项`);
  } catch (e) {
    console.error(e);
    toast('导入失败：' + e.message);
  }
}

$('btn-import-json').addEventListener('click', () => {
  vibrate();
  Modal.open({
    title: '导入书本 JSON',
    desc: '选择之前导出的 .json 备份文件。导入后会作为一本新书加入书阁，不会覆盖现有书本。',
    actions: [
      { label: '取消', kind: 'ghost' },
      { label: '选择文件', kind: 'primary', onClick: () => setTimeout(pickJsonFile, 120) }
    ]
  });
});

<script>
/* ============================================================
   全局搜索（书本内）
   模式：
     name —— 只命中文件名
     full —— 命中文件名 + 正文内容
   ============================================================ */

let searchMode = 'name';
let searchBookId = null;
let searchTimer = null;
let searchNodes = [];

/** 取节点的可搜索正文（按类型展开） */
function nodeSearchText(node) {
  switch (node.type) {
    case 'chapter':
    case 'outline':
      return node.content || '';
    case 'setting': {
      const parts = [];
      (node.categories || []).forEach((c) => {
        parts.push(c.name || '');
        parts.push(c.content || '');
      });
      return parts.join('\n');
    }
    case 'timeline': {
      const parts = [];
      (node.events || []).forEach((e) => {
        parts.push(e.time || '');
        parts.push(e.text || '');
      });
      return parts.join('\n');
    }
    default:
      return '';
  }
}

/** 转义正则特殊字符 */
function reEscape(s) {
  return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

/** 高亮命中片段（HTML 已转义后再插标记） */
function highlight(text, query) {
  const safe = esc(text);
  if (!query) return safe;
  const re = new RegExp('(' + reEscape(esc(query)) + ')', 'gi');
  return safe.replace(re, '<span class="hit">$1</span>');
}

/** 节点类型中文名 */
function shortTypeLabel(node) {
  return typeLabel(node);
}

/** 计算某节点在树中的路径，如「第一卷 / 第一章组」 */
function nodePath(node, all) {
  const parts = [];
  let cur = node;
  const guard = new Set();
  while (cur && cur.parentId && !guard.has(cur.parentId)) {
    guard.add(cur.parentId);
    const p = all.find((n) => n.id === cur.parentId);
    if (!p) break;
    parts.unshift(p.title);
    cur = p;
  }
  return parts.length ? parts.join(' / ') : '根目录';
}

/** 截取命中附近的文本片段 */
function makeSnippet(text, query, radius) {
  const t = String(text || '');
  const q = String(query || '');
  if (!t) return '';
  const lower = t.toLowerCase();
  const idx = lower.indexOf(q.toLowerCase());
  const r = radius || 42;
  if (idx < 0) return t.slice(0, r * 2);
  const start = Math.max(0, idx - r);
  const end = Math.min(t.length, idx + q.length + r);
  return (start > 0 ? '…' : '') + t.slice(start, end).replace(/\s+/g, ' ') + (end < t.length ? '…' : '');
}

/* ---------------- 打开 / 关闭 ---------------- */

async function openSearch() {
  searchBookId = state.bookId;
  if (!searchBookId) return;
  searchNodes = await Nodes.byBook(searchBookId);
  const book = await Books.get(searchBookId);
  $('search-input').placeholder = `在《${book ? book.title : ''}》中搜索…`;
  showView('search');
  setTimeout(() => $('search-input').focus(), 160);
  renderSearchResults();
}

function closeSearch() {
  $('search-input').value = '';
  $('search-status').textContent = '';
  showView('chapters');
  renderChapters();
}

function setSearchMode(mode) {
  searchMode = mode;
  document.querySelectorAll('.mode-btn').forEach((b) => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  renderSearchResults();
  $('search-input').focus();
}

/* ---------------- 匹配 ---------------- */

/** 对单个节点做匹配，返回 { node, nameHit, textHit, snippet } 或 null */
function matchNode(node, query) {
  const nameHit = (node.title || '').toLowerCase().includes(query);
  if (searchMode === 'name') {
    return nameHit ? { node, nameHit: true, textHit: false, snippet: '' } : null;
  }
  // 全文模式
  const text = nodeSearchText(node);
  const textHit = text.toLowerCase().includes(query);
  if (!nameHit && !textHit) return null;
  return {
    node,
    nameHit,
    textHit,
    snippet: textHit ? makeSnippet(text, query) : ''
  };
}

/** 排序：文件名命中优先，其次类型权重，再按更新时间 */
function resultWeight(r) {
  let w = 0;
  if (r.nameHit) w -= 100;
  if (r.node.type === 'folder') w -= 20;
  if (r.node.type === 'chapter') w -= 10;
  return w;
}

/* ---------------- 渲染 ---------------- */

function renderSearchResults() {
  const raw = $('search-input').value || '';
  const query = raw.trim().toLowerCase();
  const list = $('search-results');
  const status = $('search-status');
  list.innerHTML = '';

  $('btn-clear-search').hidden = !raw;

  if (!query) {
    status.textContent = '';
    const empty = document.createElement('div');
    empty.className = 'search-empty';
    empty.innerHTML = `<span class="se-icon">🔍</span>
      ${searchMode === 'name'
        ? '输入关键词，搜索文件夹与各类文件名'
        : '输入关键词，搜索文件名与正文内容'}<br>
      <span style="font-size:12px;opacity:.75">当前模式：${searchMode === 'name' ? '文件名搜索' : '全文搜索'}</span>`;
    list.appendChild(empty);
    return;
  }

  const results = [];
  for (const node of searchNodes) {
    const r = matchNode(node, query);
    if (r) results.push(r);
  }
  results.sort((a, b) => {
    const d = resultWeight(a) - resultWeight(b);
    return d !== 0 ? d : (b.node.updatedAt || 0) - (a.node.updatedAt || 0);
  });

  status.textContent = results.length
    ? `找到 ${results.length} 项 · ${searchMode === 'name' ? '文件名搜索' : '全文搜索'}`
    : '';

  if (!results.length) {
    const empty = document.createElement('div');
    empty.className = 'search-empty';
    empty.innerHTML = `<span class="se-icon">✿</span>
      没有找到「${esc(raw.trim())}」<br>
      <span style="font-size:12px;opacity:.75">${searchMode === 'name'
        ? '试试切换到「全文搜索」，连正文一起找'
        : '换个关键词试试'}</span>`;
    list.appendChild(empty);
    return;
  }

  results.forEach((r, i) => {
    const node = r.node;
    const row = document.createElement('div');
    row.className = 'sr-row';
    row.style.animationDelay = Math.min(i * 28, 300) + 'ms';

    const path = nodePath(node, searchNodes);
    let tail = '';
    if (node.type === 'folder') {
      const st = Nodes.folderWordCount(node.id, searchNodes);
      const bits = [];
      if (st.chapters) bits.push(`${st.chapters} 章`);
      if (st.settings) bits.push(`${st.settings} 设定`);
      if (st.others) bits.push(`${st.others} 资料`);
      tail = bits.length ? bits.join(' · ') : '空';
    } else if (node.type === 'timeline') {
      tail = `${(node.events || []).length} 事件`;
    } else {
      tail = `${node.wordCount || 0} 字`;
    }

    // 名字命中高亮
    const nameHtml = r.nameHit ? highlight(node.title, raw.trim()) : esc(node.title);

    // 全文模式下正文命中的片段
    let snippetHtml = '';
    if (searchMode === 'full' && r.textHit && r.snippet) {
      snippetHtml = `<div class="sr-snippet">${highlight(r.snippet, raw.trim())}</div>`;
    }

    const badge = (searchMode === 'full' && r.textHit && !r.nameHit)
      ? '<span class="sr-badge">正文命中</span>'
      : (searchMode === 'full' && r.nameHit ? '<span class="sr-badge name-only">文件名命中</span>' : '');

    row.innerHTML = `
      <span class="sr-icon">${nodeIcon(node)}</span>
      <span class="sr-main">
        <span class="sr-name">${nameHtml}</span>
        <span class="sr-path">${esc(shortTypeLabel(node))} · ${esc(path)}</span>
        ${snippetHtml}
        ${badge}
      </span>
      <span class="sr-tail">${esc(tail)}</span>`;

    row.addEventListener('click', () => openSearchResult(node));
    list.appendChild(row);
  });
}

/** 点击结果：章节/大纲/设定打开编辑器；文件夹进入该目录 */
async function openSearchResult(node) {
  if (node.type === 'folder') {
    state.folderId = node.id;
    $('search-input').value = '';
    showView('chapters');
    await renderChapters();
    return;
  }
  $('search-input').value = '';
  showView('chapters');   // 先回章节视图，编辑器/时间线会再切
  if (node.type === 'timeline') {
    await openTimeline(node.id);
  } else if (node.type === 'setting') {
    await openSetting(node.id);
  } else {
    await openChapter(node.id);
  }
}

/* ---------------- 事件绑定 ---------------- */

$('search-input').addEventListener('input', () => {
  $('btn-clear-search').hidden = !$('search-input').value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(renderSearchResults, 180);
});

$('search-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    clearTimeout(searchTimer);
    renderSearchResults();
    const first = document.querySelector('.sr-row');
    if (first) first.click();
  }
});

$('mode-name').addEventListener('click', () => { vibrate(); setSearchMode('name'); });
$('mode-full').addEventListener('click', () => { vibrate(); setSearchMode('full'); });

$('btn-clear-search').addEventListener('click', () => {
  $('search-input').value = '';
  $('btn-clear-search').hidden = true;
  renderSearchResults();
  $('search-input').focus();
});

$('btn-back-search').addEventListener('click', () => { vibrate(); closeSearch(); });
</script>
<script>
/* ============================================================
   IndexedDB 容量显示
   左：进度条   右：已用 / 上限
   条最右：容量切换按钮 → 8 档可选
   ============================================================ */

const CAPACITY_KEY = 'capacityLimit';
const DEFAULT_CAPACITY = 128 * 1024 * 1024;   // 128 MB

/** 可选容量档位 */
const CAPACITY_OPTIONS = [
  { label: '16 MB',  bytes: 16  * 1024 * 1024 },
  { label: '64 MB',  bytes: 64  * 1024 * 1024 },
  { label: '128 MB', bytes: 128 * 1024 * 1024, note: '默认' },
  { label: '256 MB', bytes: 256 * 1024 * 1024 },
  { label: '512 MB', bytes: 512 * 1024 * 1024 },
  { label: '1 GB',   bytes: 1024 * 1024 * 1024 },
  { label: '2 GB',   bytes: 2 * 1024 * 1024 * 1024 },
  { label: '4 GB',   bytes: 4 * 1024 * 1024 * 1024 }
];

let capacityLimit = DEFAULT_CAPACITY;

/** 人类可读体积 */
function fmtBytes(n) {
  if (!n || n < 0) n = 0;
  const KB = 1024, MB = KB * 1024, GB = MB * 1024;
  if (n < KB) return n + ' B';
  if (n < MB) return (n / KB).toFixed(n / KB < 10 ? 1 : 0) + ' KB';
  if (n < GB) {
    const v = n / MB;
    return (v < 10 ? v.toFixed(1) : Math.round(v)) + ' MB';
  }
  const v = n / GB;
  return (v < 10 ? v.toFixed(2) : v.toFixed(1)) + ' GB';
}

/** 估算本应用的 IndexedDB 已用空间（字节） */
async function estimateUsage() {
  // 优先用浏览器配额 API
  if (navigator.storage && navigator.storage.estimate) {
    try {
      const est = await navigator.storage.estimate();
      if (est && typeof est.usage === 'number') return est.usage;
    } catch (e) { /* 退回到自行统计 */ }
  }
  return measureOwnUsage();
}

/** 自行统计：把所有书本与节点的数据编码后量长度 */
async function measureOwnUsage() {
  let total = 0;
  try {
    const books = await Books.all();
    total += JSON.stringify(books).length;
    for (const b of books) {
      const nodes = await Nodes.byBook(b.id);
      total += JSON.stringify(nodes).length;
    }
  } catch (e) { /* ignore */ }
  // UTF-8 中文按 3 字节估算：粗略乘以 1.6 贴近实际
  return Math.round(total * 1.6);
}

/** 刷新容量条 */
async function refreshStorage() {
  try {
    const used = await estimateUsage();
    capacityLimit = await Settings.get(CAPACITY_KEY, DEFAULT_CAPACITY);
    if (typeof capacityLimit !== 'number' || capacityLimit <= 0) capacityLimit = DEFAULT_CAPACITY;

    const pct = Math.min(100, capacityLimit ? (used / capacityLimit) * 100 : 0);
    const fill = $('sb-fill');
    const text = $('sb-text');

    fill.style.width = pct.toFixed(2) + '%';

    const level = pct >= 90 ? 'danger' : pct >= 70 ? 'warn' : '';
    fill.classList.remove('warn', 'danger');
    text.classList.remove('warn', 'danger');
    if (level) { fill.classList.add(level); text.classList.add(level); }

    text.innerHTML = `<b>${fmtBytes(used)}</b> / ${fmtBytes(capacityLimit)}`;
    $('sb-track').title = `已用 ${fmtBytes(used)} · 上限 ${fmtBytes(capacityLimit)}（${pct.toFixed(1)}%）`;
  } catch (e) {
    console.error(e);
  }
}

/** 打开容量选择 */
async function openCapacityDialog() {
  const current = await Settings.get(CAPACITY_KEY, DEFAULT_CAPACITY);

  Modal.open({
    title: '存储容量上限',
    desc: '用于容量条显示与用量提醒。修改后立即生效。',
    fields: [{
      key: '__cap',
      label: '',
      type: 'custom',
      render: (wrap) => {
        const list = document.createElement('div');
        list.className = 'cap-list';
        CAPACITY_OPTIONS.forEach((opt) => {
          const isCur = opt.bytes === current;
          const item = document.createElement('button');
          item.className = 'cap-item' + (isCur ? ' current' : '');
          item.type = 'button';
          item.innerHTML = `<span class="cap-val">${opt.label}</span>
            ${opt.note ? `<span class="cap-note">${opt.note}</span>` : ''}
            <span class="cap-check" ${isCur ? '' : 'hidden'}>✓</span>`;
          item.addEventListener('click', async () => {
            vibrate();
            Modal.close();
            await Settings.set(CAPACITY_KEY, opt.bytes);
            capacityLimit = opt.bytes;
            await refreshStorage();
            toast(`容量上限已设为 ${opt.label}`);
          });
          list.appendChild(item);
        });
        wrap.appendChild(list);
      }
    }],
    actions: [{ label: '取消', kind: 'ghost' }]
  });
}

$('sb-cap-btn').addEventListener('click', () => { vibrate(); openCapacityDialog(); });

// 页面可见性变化时刷新（其他标签页写入后回来能同步）
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) refreshStorage();
});
</script>
<script>
/* ============================================================
   APK 集成层
   - 处理 Android 返回键：按视图层级逐级后退
   - 通知原生层当前状态（可选）
   在浏览器中打开时这些函数为无害的空操作。
   ============================================================ */

/**
 * Android 返回键入口。
 * 返回 true  —— 已在页面内处理（不要退出应用）
 * 返回 false —— 无上层视图，允许系统退出
 */
function handleAndroidBack() {
  const active = document.querySelector('.view.active');
  const id = active ? active.id : '';

  // 正在弹悬浮窗 / 长按菜单：先关掉
  if (!$('modal-overlay').hidden) { Modal.close(); return true; }
  if (!$('sheet-overlay').hidden) { Sheet.close(); return true; }

  switch (id) {
    case 'view-editor':
      // 编辑器 -> 章节列表（先落库）
      $('btn-back-chapters').click();
      return true;
    case 'view-timeline':
      $('btn-back-timeline').click();
      return true;
    case 'view-setting':
      $('btn-back-setting').click();
      return true;
    case 'view-search':
      $('btn-back-search').click();
      return true;
    case 'view-chapters':
      // 章节列表：若在子目录则回上级，否则回书阁
      if (state.folderId) {
        const cur = (state.nodesCache || []).find((n) => n.id === state.folderId);
        state.folderId = (cur && cur.parentId) ? cur.parentId : null;
        renderChapters();
      } else {
        $('btn-back-books').click();
      }
      return true;
    case 'view-books':
    default:
      // 已在首页 —— 允许退出
      return false;
  }
}

/* ---------- 导出：在 APK 中通过原生桥写文件 ---------- */

/**
 * 判断是否运行在 APK 容器里
 */
function isNativeShell() {
  return typeof window.AndroidBridge !== 'undefined' && window.AndroidBridge !== null;
}

/**
 * 把 Blob 交给原生层保存到「下载」目录。
 * 浏览器环境返回 false，由调用方走 <a download> 兜底。
 */
function saveBlobNative(blob, filename) {
  if (!isNativeShell() || !blob) return false;
  try {
    const fr = new FileReader();
    fr.onloadend = function () {
      const s = fr.result || '';
      const i = String(s).indexOf(',');
      if (i > 0) {
        window.AndroidBridge.saveBase64(String(s).substring(i + 1), filename, blob.type || '');
      }
    };
    fr.readAsDataURL(blob);
    return true;
  } catch (e) {
    return false;
  }
}

<script>
/* ============================================================
   PWA 集成层
   - 检测是否运行于 Fennec F-Droid（或 Firefox for Android）
   - 仅在该浏览器下弹出「持久存储」授权确认
   - 注册内联 Service Worker（单文件，无外部资源）
   - 注入 data: URI 的 web app manifest
   ============================================================ */

/* 图标（PNG base64 data URI）—— 由构建脚本注入 */
const PWA_ICONS = window.__PWA_ICONS__ || {};

const PWA = (() => {

  /** 当前 UA 信息 */
  function uaInfo() {
    const ua = navigator.userAgent || '';
    const isFirefox = /firefox|fxios/i.test(ua);
    const isAndroid = /android/i.test(ua);
    // Firefox for Android 的 UA 形如:
    //   Mozilla/5.0 (Android 10; Mobile; rv:130.0) Gecko/130.0 Firefox/130.0
    // Fennec F-Droid 使用同一内核与 UA，无法从 UA 区分 F-Droid 版与商店版，
    // 因此按「Firefox on Android」处理（这正是 Fennec 的运行环境）。
    const isFennec = isFirefox && isAndroid;
    return { ua, isFirefox, isAndroid, isFennec };
  }

  /** 是否已获得持久存储 */
  async function isPersisted() {
    try {
      if (navigator.storage && navigator.storage.persisted) {
        return await navigator.storage.persisted();
      }
    } catch (e) {}
    return false;
  }

  /** 申请持久存储 */
  async function requestPersist() {
    try {
      if (navigator.storage && navigator.storage.persist) {
        return await navigator.storage.persist();
      }
    } catch (e) {}
    return false;
  }

  /** 估算可用空间（供说明文案用） */
  async function quotaInfo() {
    try {
      if (navigator.storage && navigator.storage.estimate) {
        const e = await navigator.storage.estimate();
        return { usage: e.usage || 0, quota: e.quota || 0 };
      }
    } catch (e) {}
    return { usage: 0, quota: 0 };
  }

  function fmtBytes(n) {
    if (!n) return '未知';
    const KB = 1024, MB = KB * 1024, GB = MB * 1024;
    if (n < MB) return (n / KB).toFixed(1) + ' KB';
    if (n < GB) return (n / MB).toFixed(0) + ' MB';
    return (n / GB).toFixed(1) + ' GB';
  }

  /**
   * Fennec 下弹窗申请持久存储。
   * 用户点「允许」才真正调用 persist()；否则不打扰。
   */
  async function maybeAskPersist() {
    const info = uaInfo();
    if (!info.isFennec) return;                 // 非 Fennec：不申请

    const already = await isPersisted();
    const q = await quotaInfo();

    // 已经持久化过就不再打扰（除非容量快满，提示一次）
    if (already) {
      if (q.quota && q.usage / q.quota > 0.8) {
        toast('存储空间已用 ' + (q.usage / q.quota * 100).toFixed(0) + '%');
      }
      return;
    }

    Modal.open({
      title: '申请持久存储',
      desc: '检测到你在 Fennec F-Droid 中打开本应用。\n\n' +
            '浏览器默认可能在空间紧张时自动清理网站数据。授权「持久存储」后，' +
            '你的小说会被保留，直到你主动清除数据。\n\n' +
            (q.quota ? '当前可用配额约 ' + fmtBytes(q.quota) + '。' : ''),
      choices: [
        {
          icon: '🔒', label: '允许持久存储', hint: '推荐 · 数据更安全',
          onClick: async () => {
            const ok = await requestPersist();
            if (ok) {
              toast('已获得持久存储授权');
            } else {
              // Firefox 可能不弹窗而直接拒绝，引导手动设置
              Modal.open({
                title: '未能自动授权',
                desc: '浏览器没有授予持久存储。你可以在浏览器中手动开启：\n\n' +
                      '地址栏左侧的锁形图标 → 权限 → 「持久存储」设为「允许」，然后刷新页面。',
                actions: [{ label: '知道了', kind: 'primary' }]
              });
            }
          }
        },
        {
          icon: '⏳', label: '暂不申请', hint: '下次打开会再问一次',
          onClick: () => { /* 什么都不做 */ }
        }
      ],
      actions: [{ label: '关闭', kind: 'ghost' }]
    });
  }

  /**
   * 注册 Service Worker（离线可用 + 可安装）。
   *
   * 注意：Service Worker 脚本必须是「同源的 http(s) 文件」，
   * 不能用 blob: / data: URI（浏览器返回 TypeError）。
   * 本应用是单文件交付，没有独立 .js 可放，因此：
   *   - 若页面目录下存在 lavender-sw.js（用户额外放置），则注册它；
   *   - 否则跳过注册，应用功能不受影响（数据仍由 IndexedDB 持久保存，
   *     manifest 仍可让浏览器「添加到主屏幕」）。
   */
  async function registerSW() {
    if (!('serviceWorker' in navigator)) return null;
    if (!/^https?:$/.test(location.protocol)) return null;

    // 探测同目录下是否有可用的 SW 文件
    const candidates = ['lavender-sw.js', './lavender-sw.js'];
    for (const path of candidates) {
      try {
        const res = await fetch(path, { method: 'GET', cache: 'no-store' });
        if (!res.ok) continue;
        const txt = await res.text();
        if (!/addEventListener/.test(txt)) continue;   // 不是 SW 脚本
        const reg = await navigator.serviceWorker.register(path, { scope: './' });
        console.log('Service Worker 已注册：' + path);
        return reg;
      } catch (e) {
        // 继续尝试下一个
      }
    }
    // 单文件模式下没有 SW 文件，属正常情况
    console.log('未找到可注册的 Service Worker 文件（单文件模式，功能不受影响）');
    return null;
  }

  /** 注入 web app manifest（data URI，无需额外文件） */
  function injectManifest(icons) {
    try {
      const manifest = {
        name: '薰小说编辑器',
        short_name: '薰小说',
        description: '薰衣草夜主题的离线小说写作工具',
        start_url: './',
        scope: './',
        display: 'standalone',
        orientation: 'portrait',
        background_color: '#17102A',
        theme_color: '#17102A',
        lang: 'zh-CN',
        dir: 'ltr',
        icons: [
          { src: icons.icon192, sizes: '192x192', type: 'image/png', purpose: 'any' },
          { src: icons.icon512, sizes: '512x512', type: 'image/png', purpose: 'any' },
          { src: icons.maskable512, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
        ]
      };
      const json = JSON.stringify(manifest);
      // 用 base64 承载，避免 URI 转义问题
      const b64 = btoa(unescape(encodeURIComponent(json)));
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = 'data:application/manifest+json;base64,' + b64;
      document.head.appendChild(link);

      // 图标（favicon / apple-touch-icon）
      const mk = (rel, href) => {
        const l = document.createElement('link');
        l.rel = rel; l.href = href;
        if (rel === 'apple-touch-icon') l.sizes = '192x192';
        document.head.appendChild(l);
      };
      mk('icon', icons.favicon64);
      mk('apple-touch-icon', icons.icon192);

      const mt = document.createElement('meta');
      mt.name = 'theme-color';
      mt.content = '#17102A';
      document.head.appendChild(mt);

      const am = document.createElement('meta');
      am.name = 'apple-mobile-web-app-capable';
      am.content = 'yes';
      document.head.appendChild(am);
    } catch (e) {
      console.warn('manifest 注入失败：', e && e.message);
    }
  }

  /** 显示环境徽标（便于用户确认检测结果） */
  function envBadge() {
    const info = uaInfo();
    const el = document.getElementById('pwa-badge');
    if (!el) return;
    el.textContent = info.isFennec ? 'Fennec 模式' : '浏览器模式';
    el.title = info.ua;
    el.classList.toggle('fennec', info.isFennec);
    el.hidden = false;
  }

  return {
    uaInfo, isPersisted, requestPersist, quotaInfo, fmtBytes,
    maybeAskPersist, registerSW, injectManifest, envBadge
  };
})();

/* ---------------- 启动 ---------------- */

async function bootPWA() {
  try {
    // 1. 注入 manifest 与图标
    PWA.injectManifest(PWA_ICONS);

    // 2. 注册 Service Worker（离线可用 + 可安装）
    await PWA.registerSW();

    // 3. 显示环境徽标
    PWA.envBadge();

    // 4. 仅 Fennec 下询问持久存储（等首屏渲染完成再弹，避免打扰）
    const info = PWA.uaInfo();
    if (info.isFennec) {
      setTimeout(() => { PWA.maybeAskPersist(); }, 900);
    }
  } catch (e) {
    console.warn('PWA 启动异常：', e && e.message);
  }
}
</script>
<script>
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", bootPWA);
} else { bootPWA(); }
</script>
</body>
</html>
